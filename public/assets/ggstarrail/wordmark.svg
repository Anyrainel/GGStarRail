<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 0 560 200">
  <defs>
    <linearGradient id="moon" x1="220" y1="18" x2="308" y2="191" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81aec5"/>
      <stop offset="1" stop-color="#d9e1df"/>
    </linearGradient>
    <path id="crescent" d="M271 8C213 24 185 73 198 125c14 55 75 83 125 60 27-12 45-38 49-66-14 32-43 51-75 49-45-2-79-40-77-84 1-32 21-61 51-76Z"/>
    <clipPath id="moon-edge"><use href="#crescent"/></clipPath>
    <linearGradient id="express" x1="0" y1="0" x2="270" y2="-25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c91a9"/>
      <stop offset="1" stop-color="#a9c6d3"/>
    </linearGradient>
    <path id="express-body" d="M0 0 3-26 17-33 139-35 158-39h50l14 7h9l10 17 12 3 17 12H0Z"/>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf9f2"/>
      <stop offset="1" stop-color="#dee8ec"/>
    </linearGradient>
    <path id="g" d="M43 0H10L0 10V47L9 56H43V26H23L18 34H33V47H11V9H38Z"/>
    <path id="a" fill-rule="evenodd" d="M0 56 22 0H31L52 56H40L33 39H14L7 56ZM18 30H30L24 12Z"/>
    <path id="r" fill-rule="evenodd" d="M0 56V0H35L44 9V22L34 32H26L49 56H34L11 32V56ZM11 9V23H29L33 19V13L29 9Z"/>
    <path id="t" d="M0 0H48L43 9H28V56H16V9H0Z"/>
    <path id="i" d="M0 0H12V56H0Z"/>
    <path id="f" d="M0 0H41L36 9H11V25H34L29 34H11V56H0Z"/>
    <path id="c" d="M43 0H10L0 10V47L9 56H43L38 47H11V9H38Z"/>
  </defs>
  <!-- The crescent, Express, and lettering share restrained blue-grey edges
       and ivory highlights; the lettering remains the brightest surface. -->
  <g transform="translate(-12 -6)">
    <use href="#crescent" fill="url(#moon)" stroke="#658297" stroke-width=".8"/>
    <g clip-path="url(#moon-edge)">
      <path d="M264 13C208 36 186 94 211 142s83 63 124 34" fill="none" stroke="#e4edf0" stroke-width="1.2" opacity=".7"/>
    </g>
  </g>
  <!-- The Express rises from the lettering's baseline through the crescent.
       Its connected silhouette suggests a locomotive without miniature hardware. -->
  <g transform="translate(221 167) rotate(-24) scale(.9 1)">
    <use href="#express-body" fill="url(#express)" stroke="#658297" stroke-width=".8"/>
    <path d="m16-28 125-3 20-5h42l-9 5-40 2-18 7H13Z" fill="#d9e1df" opacity=".55"/>
    <path d="m13-15 127-4 23-7h46l17 13-30-3-43 7L12-7Z" fill="#658297"/>
    <path d="m18-30 124-3 20-4h43m-189 33 135-5 46-2 43 6" fill="none" stroke="#e4edf0" stroke-width="1.2" opacity=".7"/>
  </g>
  <!-- Hand-drawn angular letterforms spell GGArtifact in small capitals. -->
  <g transform="translate(84 84) skewX(-13)" fill="url(#letters)" stroke="#30495c" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke fill">
    <use href="#g"/>
    <use href="#g" x="49"/>
    <use href="#a" x="99"/>
    <g transform="translate(155 10) scale(.84 .82)">
      <use href="#r"/>
      <use href="#t" x="51"/>
      <use href="#i" x="104"/>
      <use href="#f" x="123"/>
      <use href="#a" x="168"/>
      <use href="#c" x="226"/>
      <use href="#t" x="275"/>
    </g>
  </g>
</svg>

# Combat translation tracker: preservation. Schema: .agents/skills/hsr-combat/tracking.md
- id: dan-heng-pt-bondmate-choice
  entity: "1414"
  rule: C3
  status: completed
  category: approximation
  summary: >
    The Bondmate is picked by heuristic (damage Paths, then Nihility, then the
    highest ATK, never Dan Heng unless alone) through a Skill turn choice; the
    player's actual choice cannot be expressed (see engine-ally-option-vocabulary).
  detail: >
    The Bondmate is now a user choice (`k.ally("bondmate")`, Dan Heng
    included). The default is the first damage-Path teammate (Destruction,
    The Hunt, Erudition, Remembrance, Elation), then Nihility, then the
    earliest slot, and Dan Heng only when alone; the ATK tie-break is gone
    since team info has no stats at build time. The Skill turn choice aims at
    the chosen ally's unit (found by slot).
- id: dan-heng-pt-e6-field-effect
  entity: "1414"
  rule: U3
  status: completed
  category: bug
  summary: >
    E6 "DMG taken +20% while the Bondmate is on the field" is a non-debuff
    enemy status applied when the Bondmate is designated; confirm it does not
    count as a debuff for per-debuff effects.
  detail: >
    The E6 enemy status (one-dream-dmg-taken) is now `debuff: true`, applied
    with certainty to every enemy whenever the Bondmate is designated and
    kept for the battle (the Bondmate never leaves the field), so it counts
    for per-debuff effects.

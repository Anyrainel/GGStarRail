- id: trailblazer-preservation-a6-shield
  entity: "8003"
  rule: U12
  status: completed
  category: approximation
  summary: >
    A6 checks a marker for the Talent's own Shield (2 turns, renewed by every
    Basic ATK, Skill, and Ultimate); Shields from teammates or the Technique,
    and Shields broken by enemy hits, are not seen.
  detail: >
    The Talent's Shield is now a `family: "shield"` status on every ally (#2
    of the Talent's turns, renewed by Basic ATK, Enhanced Basic ATK, Skill,
    and Ultimate), and A6 checks `hasFamily("shield")` at turn start, so
    Shields from any kit count. The Technique's Shield is not modelled
    (Technique), and Shields are not broken by hits (Shield HP is not
    modelled, U12).
- id: trailblazer-preservation-taunt-aggro
  entity: "8003"
  rule: U12
  status: completed
  category: engine-gap
  summary: >
    The Skill's Taunt is applied as a debuff but does not redirect enemy
    attacks, so Magma Will from being hit (and hit Energy) uses the base
    Preservation aggro share (see engine-aggro-modifiers).
  detail: >
    The Skill's Taunt status is now `taunt: true` (base chance #2 of 800302,

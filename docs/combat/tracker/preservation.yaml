- id: march-7th-taunt-counters
  entity: "1001"
  rule: U12
  status: completed
  category: approximation
  summary: >
    The Skill's taunt is not modelled (engine-aggro-modifiers), so Counters
    fire on the shielded ally's base aggro share. The Skill shields March 7th
    herself (highest base aggro), and E2's lowest-HP battle-start Shield (all
    allies at full HP) is assumed to land on her.
  detail: >
    The Skill's Shield (and E2's) are `family: "shield"` statuses, and the
    Counter reacts to any Shielded ally (`hasFamily("shield")`). The Skill's
    "greatly increases the chance of being attacked" is a lure status with
    `aggroPct` #5 of 100102 (5, i.e. +500%), kept while the Shield lasts and
    the ally's HP is at #3 (30%) or more (synced on hpChanged and on the
    Shield's statusRemoved). E2's Shield goes to the ally with the lowest
    hpRatio at battle start (ties: March 7th). The policy still shields March
    herself whenever her Skill's Shield is gone.
- id: fu-xuan-e6-hp-tally
  entity: "1208"
  rule: U12
  status: completed
  category: approximation
  summary: >
    E6's HP-loss tally is the toggle e6-hp-loss-tally-capped (default on: the
    tally is at its 120% Max HP cap at every Ultimate, +240% Max HP per
    target); HP loss is not simulated.
  detail: >
    The toggle is gone. While Matrix of Prescience is active (Fu Xuan holds
    her own Knowledge), every ally's hpChanged with delta < 0 adds
    −delta x weight x that ally's panel Max HP / Fu Xuan's panel Max HP to a
    counter capped at #2 of E6; the Ultimate's functional `hits` add #1 of E6
    x tally to its HP multiplier, and the tally resets after it. Matrix's DMG
    redistribution is not modelled (fu-xuan-matrix-hp), so losses stay on the
    allies hit. The Talent's HP Restore (#3 of missing HP at #2 HP or
    less; 1 count, +1 per Ultimate, max 2) and A4's Ultimate heal on other
    allies now call ctx.heal with her Outgoing Healing.
- id: gepard-talent-killing-blow
  entity: "1104"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    The Talent's revive drives A4 (Energy to 100%) and E6 (immediate action),
    but killing blows are not simulated (engine-hp-model), so neither fires.
  detail: >
    Blocked on engine-ally-killing-blow. The HP model keeps allies at 1% HP
    or more, so a killing blow never happens. Once it can: the Talent
    revives once (restoring its share of Max HP), A4 regenerates Energy to
    100%, and E6 grants immediate action.
- id: fu-xuan-matrix-hp
  entity: "1208"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Matrix of Prescience's DMG redistribution (teammates pass 65% of the DMG
    they receive to Fu Xuan) and Misfortune Avoidance's 18% DMG reduction do
    not change HP loss, so the Talent's HP Restore triggers late and allies
    lose more HP than in game.
  detail: >
    Blocked on engine-ally-dmg-redistribution and engine-ally-hp-modifiers.
    Once enemy-hit HP loss can be redirected and reduced, the Matrix sends #1
    of 120802 of each teammate's loss to Fu Xuan (before Shields), and
    Misfortune Avoidance reduces every ally's loss by #1 of 120804.

- id: mutual-demise-own-hp
  entity: "20016"
  rule: U12
  status: completed
  category: bug
  summary: >
    Mutual Demise's CRIT Rate below 80% HP is an off-by-default toggle (U8
    table) for the whole battle, because HP is not simulated; HP-consuming
    wearers such as Blade usually stay below 80%.
  detail: >
    Removed the self-hp-below toggle. The CRIT Rate (#2) is a status on the
    wearer synced on its own hpChanged: present while hpRatio < #1. It
    starts off (HP starts full) and turns on once enemy attacks or HP costs
    bring the wearer below #1 (checked with a scratch wearer whose Skill
    consumes 30%). Blade, Arlan, Mydei, and Firefly reach it through their
    own costs only once their kits call consumeHp; until then only enemy
    attacks lower their HP.
- id: a-secret-vow-hp-compare
  entity: "21012"
  rule: U12
  status: open
  category: approximation
  summary: >
    A Secret Vow's extra DMG against enemies whose HP percentage is at least
    the wearer's is one on-by-default toggle (condition "active") for every
    target: HP is not simulated, the option vocabulary has no relative-HP
    condition, and the U8 table has no default for it.
  detail: >
    Blocked on engine-kill-triggers (enemy HP is not simulated). The
    wearer's side is simulated now (self.hpRatio); once enemy HP exists,
    compare per target and drop the toggle.
- id: flames-afar-hp-loss
  entity: "21038"
  rule: U12
  status: completed
  category: approximation
  summary: >
    Flames Afar's trigger (one HP loss or consumption above 25% of Max HP) is
    an on-by-default toggle that fires at the start of each wearer action off
    cooldown, an upper bound that fits Blade's and Firefly's Skills but also
    fires for wearers without such HP costs. With the toggle off it never
    fires, even after large enemy hits.
  detail: >
    Removed the hp-loss toggle. hpChanged (subject self, hpCause consume)
    with -delta > #1 while off cooldown heals the wearer #3 of Max HP (times
    1 + Outgoing Healing, U12), applies Deflagration (stacks = weight) and
    the #5-turn cooldown. Enemy attacks are not listened to. Checked with a
    scratch wearer whose Skill consumes 30%; with Blade, Firefly, and Mydei
    it fires once their kits call consumeHp (Blade's does not yet, so it
    currently never fires there).
- id: ninja-record-hp-change
  entity: "22003"
  rule: U12
  status: completed
  category: approximation
  summary: >
    Ninja Record: Sound Hunt triggers from enemy hits on the wearer
    (hitByEnemy, aggro share as stacks), and an on-by-default toggle stands
    for the wearer's own HP costs and allies' healing by triggering at each
    of its actions, so the CRIT DMG is effectively permanent by default.
  detail: >
    Removed the hp-changes toggle and its every-action trigger. Curtains Up!
    (stacks = weight) comes from hitByEnemy and from hpChanged (subject
    self) with hpCause consume or heal, each with limitPerTurn 1; a second
    trigger in one turn only refreshes it (1 stack max). Checked with a
    scratch wearer that consumes and heals; costs and heals from Character
    kits arrive as those kits call consumeHp and heal.

- id: mediation-unique-strongest
  entity: "20019"
  rule: U13
  status: wont-do
  category: engine-gap
  summary: >
    Unique statuses keep the copy with the most stacks (the first applied on
    a tie), not the strongest value, so two wearers of Mediation, Past and
    Future, Dreamville Adventure, or Poised to Bloom at different
    Superimpositions may keep the weaker copy; team auras compare values.
  detail: >
    Fixed in engine 61c14f6: unique statuses keep the copy with the
    largest value (stacks, landing chance, and scaling included), and turn
    order applies the same rule to SPD.

- id: past-and-future-next-ally
  entity: "21025"
  rule: U8
  status: open
  category: verify
  summary: >
    Past and Future buffs the ally (Character or memosprite) earliest in the
    Action Order when the wearer's Skill ends, after the Skill's own advances.
    Verify whether the game instead waits for the ally that actually acts
    next when an Ultimate, advance, or extra turn intervenes.
  detail: >
    Convention (next ally): 'the next ally taking action' is predicted
    from the Action Order when the wearer's Skill ends (after the Skill's
    own advances), among Characters and memosprites other than the wearer,
    and receives the buff at once. This kit is the reference; But the
    Battle Isn't Over (23003) adopts it. Kept open as the single check of
    the convention: whether an advance, extra turn, or Ultimate between
    the Skill and the predicted turn changes the recipient in game.
    Neither the dossier text nor fribbels (an always-on toggle) settles
    it.
- id: final-victor-crit-stacks
  entity: "21037"
  rule: U9
  status: completed
  category: approximation
  summary: >
    Good Fortune is gained in expectation: each hit event (every damage
    instance on every enemy) adds the wearer's panel CRIT Rate in stacks,
    effective from the next hit. Momentary CRIT Rate buffs are ignored, the
    4-stack cap applies to the expected sum, and per-target counting on
    Blast/AoE hits is assumed.
  detail: >
    Each hit now adds the wearer's currentStat('critRate') (timed statuses
    included) in stacks instead of the panel CRIT Rate. Filtered and scaling
    CRIT Rate modifiers are still left out (currentStat excludes them); the
    rest of the expected-value model is unchanged.
- id: swordplay-stack-timing
  entity: "21010"
  rule: U6
  status: open
  category: verify
  summary: >
    Swordplay gains 1 stack per attack on the attack's main target after its
    hits, and the first attack on a new target already grants a stack.
    Confirm per-attack versus per-hit stacking and whether the stack counts
    for the attack that triggers it.
  detail: >
    Not settled: the text (EN 'for each time the wearer hits the same
    target', ZH 每次) does not say whether a multi-hit attack grants one
    stack or one per hit, and fribbels uses a 0-5 slider (default 5).
- id: shadowed-by-night-super-break
  entity: "21047"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    The SPD buff triggers on the wearer's Weakness Breaks, Break-tagged
    procs, and Break DoT ticks, but Super Break DMG emits no event, so Super
    Break DMG dealt by the wearer does not trigger it.
  detail: >
    breakDamage (limitPerTurn 1) replaces the weaknessBreak listener and
    covers Weakness Break and Super Break DMG; the Break-tagged hit and
    Break DoT listeners stay for procs and ticks. breakDamage also fires for
    Toughness reduced on Broken enemies by attackers with no Super Break
    conversion (which deals no DMG; engine-break-damage-no-conversion), so a
    Super Break event counts only while the wearer's
    currentStat('superBreakDmg') > 0 (checked: Boothill with Harmony
    Trailblazer triggers, Seele alone does not). currentStat leaves out
    filtered and scaling conversions (Rappa, Firefly, The Dahlia's
    Follow-up), none of which reach a Hunt wearer.
- id: but-the-battle-isnt-over-sp-timing
  entity: "23003"
  rule: U10
  status: completed
  category: verify
  summary: >
    The Skill Point fires on the 1st, 3rd, 5th... Ultimate ("once after every
    2 uses"), and only for Ultimates that attack no enemy (read as "on an
    ally"). Verify whether the game recovers it on the 2nd, 4th... use instead.
  detail: >
    The Skill Point needs the wearer's Ultimate to be aimed at an ally
    (abilityTarget ally, allies, or self); the !event.attack test is gone.
    Timing reading kept: the first, third, fifth... Ultimate recovers it,
    and every Ultimate counts toward the 2 uses. Checked with Sunday, whose
    Ultimate names an ally, and a scratch Harmony wearer.
- id: but-the-battle-isnt-over-next-ally
  entity: "23003"
  rule: U8
  status: completed
  category: verify
  summary: >
    The DMG buff goes to the next teammate (Character or memosprite) whose
    turn starts after the wearer's Skill and lasts until the end of that
    turn; Ultimates cast in between do not count as "taking action". Past and
    Future (21025) instead predicts the next ally from the Action Order.
  detail: >
    As Past and Future: at the end of the wearer's Skill, the ally in the
    Action Order (Character or memosprite, not the wearer) with the smallest
    actionGauge / speed receives the buff at once, with duration { turns: #3
    } and unique: true. The pending counter and turn counting are gone.
    Checked with Sunday (his Skill makes its target act at once, so it holds
    the buff for that turn) and a scratch wearer (Robin, Kafka, and a
    memosprite each held it until the end of their next turn). The open
    check is past-and-future-next-ally.
- id: earthly-escapade-sp-overflow
  entity: "23021"

- id: sleep-like-the-dead-crit-chance
  entity: "23012"
  rule: U9
  status: open
  category: approximation
  summary: >
    CRIT is an expected value, so the trigger chance of a Basic ATK or Skill
    is 1 minus the chance that all its DMG instances CRIT, read from the
    wearer's steady-panel CRIT Rate (momentary CRIT Rate buffs and the
    per-target CRIT Rate of other effects are ignored); the buff is applied
    after the action rather than mid-action.
  detail: "Cooldown and buff windows are tracked as trigger chances of the last own turns (counters on the wearer); triggers inside one cooldown window are mutually exclusive, so their chances add up exactly."
- id: sleep-like-the-dead-trigger-scope
  entity: "23012"
  rule: U9
  status: open
  category: verify
  summary: >
    The kit triggers when any DMG instance of a Basic ATK or Skill (every
    target of a Blast included) does not CRIT, and lets the effect trigger
    again on the third own turn after triggering. Confirm per-instance versus
    per-action checking and how the 3-turn cooldown is counted.
  detail: ""
- id: worrisome-blissful-tame-stacks

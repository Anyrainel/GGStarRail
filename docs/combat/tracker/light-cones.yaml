- id: life-should-be-cast-to-flames-implanter
  entity: "23041"
  rule: U14
  status: completed
  category: engine-gap
  summary: >
    Life Should Be Cast to Flames boosts DMG against enemies with a Weakness
    implanted by the wearer, but implantWeakness does not record who added a
    Weakness. The kit treats Weaknesses that appear during the wearer's own
    actions as the wearer's (a marker status on the enemy); implants made
    outside them (Anaxa's E2 at battle start) are missed.
  detail: >
    weaknessImplanted with the wearer as implanter records the Combat Type
    on the enemy and marks it; Weaknesses that expired or were removed are
    dropped before each of the wearer's actions. The inference from Weakness
    changes during the wearer's actions is gone, so battle-start implants
    (Anaxa's E2) count. A Weakness another unit implanted first emits no
    event when the wearer refreshes it (engine-weakness-implanted-event).
    Checked with a scratch implanter.
- id: life-should-be-cast-to-flames-def-timing
  entity: "23041"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Life Should Be Cast to Flames lowers DEF "when an enemy gets attacked by

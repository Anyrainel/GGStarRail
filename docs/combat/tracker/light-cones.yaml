- id: time-waits-for-no-one-healing-record
  entity: "23013"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Time Waits for No One's Additional DMG (a share of the healing the wearer
    recorded, dealt once per turn when an ally attacks) is not modeled: heal
    amounts are not simulated, so there is nothing to record. Only the
    catalog Max HP and Outgoing Healing apply.
  detail: >
    Needs heal events carrying the healed amount (engine-hp-model) and a
    damage kind that ignores the attacker's buffs but keeps enemy DEF, RES,
    vulnerability, and the Toughness multiplier (`fixed` also skips DEF and
    RES). Then verify whether the record includes overhealing and resets
    after each proc.
- id: night-of-fright-heal-triggers
  entity: "23017"
  rule: U12
  status: open
  category: approximation
  summary: >
    Night of Fright's ATK stacks come from the wearer's heals. Healing is not

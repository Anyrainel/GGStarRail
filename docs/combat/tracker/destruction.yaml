- id: misha-freeze-chance
  entity: "1312"
  rule: U9
  status: open
  category: engine-gap
  summary: >
    Freeze landing is not EHR-evaluated: the engine has no landing chance for
    a debuff's non-DoT turn-start DMG (deal()) nor a "target is Frozen"
    filter for A6. The kit keeps the expected Freeze chance in the status's
    stacks, using the base chance (A4's +60% EHR taken to offset typical
    Effect RES), and scales the Freeze Additional DMG and A6 CRIT DMG by it.
  detail: >
    Blocked on engine-debuff-landing-chance (it names Misha's Freezes and
    their combined repeated attempts); the turn-start Additional DMG also
    needs engine-control-turn-start-dmg. Once both exist: Freeze is a debuff
    with family "frozen", skipsTurn, and the turn-start Additional DMG,
    applied per hit with `baseChance` (#3 of 131203, + A2 on the first hit);
    A6 uses a chance-weighted "frozen" filter; the stacks-as-chance
    bookkeeping goes.
- id: misha-freeze-skip
  entity: "1312"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    A Freeze applied by a kit does not skip the enemy's action; the engine
    only checks Weakness Break Frozen, and presence-based skipping would
    ignore the landing chance.
  detail: >
    `skipsTurn` exists: give the Freeze status `skipsTurn: true` and
    `family: "frozen"`, and apply it with the combined chance the kit
    already computes as `baseChance` too (`{ setStacks: after, baseChance:
    after }` in attemptFreeze), since the engine skips with the status's
    base chance. The turn-start DMG and A6 keep reading the stacks until
    misha-freeze-chance.
- id: misha-a4-permanent
  entity: "1312"
  rule: U3
  status: open
  category: approximation
  summary: >
    A4 (EHR +60% until the end of the Ultimate's action) is a permanent stat,
    because debuff landing reads the panel EHR and every debuff Misha applies
    comes from the Ultimate. It also shows on the panel and would feed any
    EHR-scaling equipment.
  detail: >
    Blocked on engine-applier-momentary-stats (landing chances read the
    applier's steady panel). Once landing chances use the applier's statuses
    at application, A4 becomes a status present only during the Ultimate's
    action. Meanwhile the permanent stat gives the right landing chances,
    because the Ultimate applies all of Misha's debuffs.
- id: misha-sp-tracking
  entity: "1312"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    There is no Skill Point consumption event; the Talent reads the drop in
    the team's Skill Points at each actionStart against the total seen at the
    previous actionStart/actionEnd/turnStart. SP gained by listeners that run
    after Misha's in the same event can hide a later consumption.
  detail: >
    Replace the sp-seen bookkeeping with `k.on("skillPointsChanged",
    "talent", { subject: "ally", when: (e) => (e.delta ?? 0) < 0 }, ...)`:
    hits += −delta x k.param("04", 2) and `gainEnergy(self, −delta x
    k.param("04", 1))` (event weight 1; delta is already the expected
    change).

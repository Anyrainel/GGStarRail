- id: phainon-territory-timeline
  entity: "1408"
  rule: U11
  status: open
  category: engine-gap
  summary: >
    The Territory runs Khaslana's 8 extra turns on its own timeline. The kit
    runs the transformation as a chain of queued actions at zero action value
    (7 actions, then the final hit; E2 extra turns add actions), with
    teammates out of the Action Order and no buff countdowns.
  detail: >
    Blocked on engine-separate-timeline. Once a Territory timeline exists:
    Khaslana's 8 extra turns at #3 of 140803 x base SPD (E1 66%), enemy

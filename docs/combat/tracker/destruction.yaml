- id: yunli-intuit-energy-toughness
  entity: "1221"
  rule: U1
  status: actionable
  category: needs-data
  summary: >
    Energy regenerated by Intuit: Slash/Cull themselves and the Toughness
    reduction of Cull's extra random instances are not in the facts; the kit
    assumes none (the Talent's 15 Energy is still granted when Cull answers an
    attack).
  detail: >
    Settled by the pinned TurnBasedGameData ability config
    (Config/ConfigAbility/Avatar/Avatar_Yunli_00_Ability.json): Cull's extra
    instances use StanceValue = first slot (20) x 0.25 = 5 each (fribbels
    Yunli.ts: 20 + 5 per hit), and Slash and Cull
    (Skill03_NormalCounter/SuperCounter) contain no ModifySPNew, so they
    regenerate no Energy. Set `toughness: { each: 5 }` on Cull's bounce
    part; keep no Energy.
- id: yunli-slash-random-target
  entity: "1221"
  rule: U9
  status: actionable
  category: approximation
  summary: >
    Intuit: Slash on a random enemy is centred on the engine's main target;
    there is no expected-distribution construct for a Blast centred on a
    random enemy.
  detail: >
    Decide Slash vs Cull once in parryExpires, then queue Slash once per
    enemy with `{ target: enemy, weight: 1 / ctx.enemies.length }` (U9:
    random targets as weighted branches); with 3 enemies its adjacent hits
    average 4/3 instead of 2.
- id: yunli-a6-probable-counters
  entity: "1221"
  rule: U9
  status: actionable
  category: approximation
  summary: >
    A6's ATK buff is applied in full by Talent Counters that only happen with
    Yunli's aggro share of each enemy attack, overstating its uptime.
  detail: >
    Exact in the current API: Talent Counters run with ctx.weight = Yunli's
    aggro share. In `counterStart` remember the prior True Sunder stacks s
    and apply it at full strength for the Counter's own hits (their DMG is
    already weighted); in `counterEnd` set stacks to 1 − (1 − s)(1 −
    ctx.weight) with `setStatusStacks` (U9). Unweighted Counters keep full
    stacks.
- id: mydei-hp-model
  entity: "1404"
  rule: U12
  status: actionable
  category: engine-gap
  summary: >
    HP is not simulated, but HP loss is Mydei's Charge source. The kit tracks
    HP as a fraction of Max HP: Skill/Kingslayer consume their share of current
    HP, each enemy attack (aggro-weighted hitByEnemy) costs an assumed 10% Max
    HP, and the "sustained" toggle (selfHpAbove, default on) tops HP up to 80%
    at the start of his turns; his own heals (Vendetta entry, Ultimate, E4) are
    applied.
  detail: >
    Replace the kit's hp counter with engine HP: Skill/Kingslayer
    `ctx.consumeHp(self, hpRatio x #3)`, Vendetta entry `ctx.heal(self,
    k.param("04", 1))`, Ultimate and E4 heals with `ctx.heal`. Charge from
    hpChanged on Mydei with delta < 0: `addCounter(charge, −delta x 100 x
    ratio)` (the event weight scales it; ratio 1, or the A6 ratio for
    hpCause enemy). E2 converts heals from hpChanged with hpCause heal
    (heals at full HP are reported). Drop the `sustained` toggle and the
    assumed 10% per enemy attack. Killing blows: allies stay at 1% HP or
    more, so keep the kit's own emulation (an enemy hit that leaves him at
    the floor during Vendetta) until engine-ally-killing-blow exists.
- id: mydei-extra-turn-timing
  entity: "1404"
  rule: U11
  status: wont-do
  category: engine-gap
  summary: >
    "Immediately gains 1 extra turn" for Godslayer Be God is delayed when the
    threshold is crossed outside a turn (e.g. by the Ultimate's +20 Charge):
    the engine only processes extra turns after the next actor's turn.
  detail: >
    Fixed by engine-pass-wave1 ("extra turns from Ultimates waiting a
    turn"): an extra turn granted inside the Ultimate (its +20 Charge) runs
    before the next turn, and one granted at an enemy's turnEnd runs right
    after that turn.
- id: mydei-e2-vendetta-scope
  entity: "1404"

- id: trailblazer-destruction-ultimate-mode
  entity: "8001"
  rule: C3
  status: actionable
  category: engine-gap
  summary: >
    The Ultimate mode is a user option (default "Blowout - RIP Home Run")
    because the engine only casts the ability "ultimate"; against one enemy
    "Farewell Hit" is better. A policy that picks the Ultimate variant (by
    enemy count) would remove the option.
  detail: >
    Ultimate variants exist. Declare `ultimate` as Blowout: Farewell Hit
    (800108: single, k.param("08", 1), Toughness 30) and `ultimateRip` as
    Blowout: RIP Home Run (800109: blast k.param("09", 1)/("09", 2),
    Toughness 20/20); drop the `rip-home-run` toggle. The Ultimate policy
    returns "ultimateRip" when the designated target has a neighbour and A6
    is unlocked (270% x 1.25 + 162% > 450%), or with 3+ enemies without A6,
    else true (Farewell Hit). A6 applies only to RIP Home Run
    (trailblazer-destruction-a6-target).

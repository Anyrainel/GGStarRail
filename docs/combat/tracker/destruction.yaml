- id: saber-ultimate-toughness
  entity: "1014"
  rule: U1
  status: actionable
  category: bug
  summary: >
    Saber's Ultimate stance list (raw 60/120/0) is read as 40 Toughness per
    enemy for the AoE part and 20 per bounce instance (Welt/Sampo/Argenti
    convention), i.e. 200 over 10 bounces; Gilgamesh's parallel Ultimate lists
    2 per bounce. Confirm the per-instance value.
  detail: >
    Settled by the pinned TurnBasedGameData ability config
    (Config/ConfigAbility/Avatar/Avatar_Saber_00_Ability.json): each random
    instance uses StanceValue = first stance slot (20) x
    `_S03_Stance_Ratio`, which Skill03 sets to 1 / the instance count (#3 =
    10), so the 20 is the total over the 10 instances: 2 per instance, as
    fribbels Saber.ts (40 + 20 / enemyCount) and like Gilgamesh's parallel
    Ultimate (2 per instance). Fix: bounce `toughness: { each: 2 }` (20 / #3
    of 101403); the AoE part keeps 40.

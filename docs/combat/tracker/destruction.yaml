  entity: "1109"
  rule: C1
  status: actionable
  category: bug
  summary: >
    The Talent is read as one trigger per attack, checked on the designated
    target before the hit lands (E4 refers to "the designated enemy target").
    If it triggers per Burned target hit, the Enhanced Skill's adjacent
    targets also take Additional DMG and grant Energy.
  detail: >
    Settled by the pinned TurnBasedGameData ability config
    (Config/ConfigAbility/Avatar/Avatar_Hook_00_Ability.json): the Talent

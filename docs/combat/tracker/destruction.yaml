- id: blade-hp-not-simulated
  entity: "1205"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    HP is not simulated, but Blade's HP loss feeds Charge, the Ultimate's HP
    tally, and E4. Two toggles stand in for it: "Ultimate cast above 50% HP"
    (+1 Charge, E4 stack; default on) and "HP-loss tally capped" (90% Max HP;
    default on).
  detail: >
    With the tally toggle off, the tally is only his own Skill (30%) and Forest
    of Swords (10%) consumption since the last Ultimate; enemy DMG, healing, and
    the Ultimate's own reset to 50% are not counted. Charge from enemy attacks
    uses the engine's aggro-weighted hitByEnemy; HP consumed by allies' effects
    (e.g. Jingliu) gives no Charge. The tally is applied by rewriting the
    Ultimate's HP HitDef multiplier in `before`, since HitDef multipliers are
    static.

- id: phainon-territory-weakness
  entity: "1408"
  rule: U5
  status: actionable
  category: engine-gap
  summary: >
    "Within the Territory, all enemies have Physical Weaknesses" uses
    implantWeakness, which is permanent; the Weakness persists after the
    transformation ends.
  detail: >
    At the final hit, `ctx.removeWeakness(enemy, "Physical")` on the enemies
    the Ultimate implanted it on; removeWeakness also deletes a native
    Weakness, so record which enemies lacked Physical before implanting (a
    counter on the enemy). The game lists the Territory Weakness as a Debuff
    status (MAvatar_Phainon_00_Ultra_Weakness). Until
    engine-implant-weakness-res is done, RES is read from the Weakness set
    after the battle, so the removal also changes the RES of Khaslana's
    earlier hits.

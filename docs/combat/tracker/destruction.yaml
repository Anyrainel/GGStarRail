    and its adjacent enemies (AbilityTargetAndAdjoinEntity, ByRandom) for
    the Energy, the Additional DMG, and E4. Kit change: move the check after
    the hits; in the Enhanced Skill, with k Burned enemies among those hit,
    deal the Additional DMG to each with weight 1/k (Energy once). Do with
    hook-burn-sources.

- id: blade-hp-not-simulated
  entity: "1205"
  rule: U12
  status: actionable
  category: engine-gap
  summary: >
    HP is not simulated, but Blade's HP loss feeds Charge, the Ultimate's HP
    tally, and E4. Two toggles stand in for it: "Ultimate cast above 50% HP"
    (+1 Charge, E4 stack; default on) and "HP-loss tally capped" (90% Max HP;
    default on).
  detail: >
    The engine simulates HP (U12; own-HP options and HP counters are now
    [BUG]). Drop both toggles and the hp-consumed/hp-tally counters. Skill
    `ctx.consumeHp(self, k.param("02", 1))`, Forest of Swords
    `consumeHp(self, k.param("08", 1))`, Ultimate `ctx.setHp(self, 0.5)` in
    text order before its hits, Talent Follow-Up `ctx.heal(self,
    k.param("04", 3))`. Charge: +1 per own consumption (hpChanged on Blade
    with hpCause consume, which also covers HP consumed by allies such as
    Jingliu) and +1 per enemy attack (keep hitByEnemy, aggro-weighted, max 1
    per attack). Tally: sum −delta x weight of hpChanged on Blade with delta
    < 0 (all causes, the Ultimate's setHp included), capped at #7 of 120503,
    reset after the Ultimate; compute the Ultimate's HP multipliers with
    functional `hits` instead of rewriting the shared HitDef in `before`.
- id: blade-e4-crossings
  entity: "1205"
  rule: U8
  status: actionable
  category: approximation
  summary: >
    E4 ("HP drops from above 50% to 50% or lower") gains a stack the first time
    Blade's cumulative own HP consumption reaches 50% (from full HP) and on each
    Ultimate cast with the above-50% toggle on; real crossings depend on
    healing and enemy DMG.
  detail: >
    With the HP model: on hpChanged for Blade with delta < 0, compare before
    = hpRatio − delta x weight with after = hpRatio; when before > 0.5 >=
    after, apply one E4 stack (max #2, stacks: weight for a partial
    crossing). Drop the e4-first-drop counter and the Ultimate toggle path.
    Heals (Talent, sustains) bring him back above 50% for later crossings.
- id: blade-hellscape-skill-turn
  entity: "1205"
  rule: U5
  status: actionable
  category: approximation
  summary: >
    Hellscape (3 turns) is applied with 2 turns because the Skill does not end
    the turn and the engine skips the applying turn's countdown; the kit gives
    Skill + 3 Forest of Swords per Skill Point (community rotation). Confirm
    the turn the Skill is used in counts.
  detail: >
    Settled: Hellscape's 3 turns include the Skill's own turn (the usual
    rotation is Skill + Forest of Swords in that turn, then two more Forest
    turns: 3 Forest of Swords per Skill), so `turns: k.param("02", 2) − 1`
    stays, since the engine skips the applying turn's countdown. Now that
    `endsTurn: false` works, give the Skill `endsTurn: false` and let the
    turn policy pick `enhancedBasic` (it already does while Hellscape is up)
    instead of queueing it, so Ultimates may come between them and Forest of
    Swords is the turn's action.

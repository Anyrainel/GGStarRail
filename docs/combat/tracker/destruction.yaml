- id: mydei-hp-model
  entity: "1404"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    HP is not simulated, but HP loss is Mydei's Charge source. The kit tracks
    HP as a fraction of Max HP: Skill/Kingslayer consume their share of current
    HP, each enemy attack (aggro-weighted hitByEnemy) costs an assumed 10% Max
    HP, and the "sustained" toggle (selfHpAbove, default on) tops HP up to 80%
    at the start of his turns; his own heals (Vendetta entry, Ultimate, E4) are
    applied.
  detail: >
    Not modeled: real enemy DMG size (and DEF 0 in Vendetta), allies' heals
    other than the turn-start top-up (so E2 conversions from teammates' heals
    are undercounted), HP costs from allies. The 10% per enemy attack is a
    constant because the option vocabulary has no numeric environment value.
    A6's Charge ratio from enemy DMG reads panelStat("hp") at battle start, so
    the timeline depends on panel HP (capped at 8000 HP, which typical builds
    reach). The HP fraction is kept unchanged when Vendetta raises Max HP.

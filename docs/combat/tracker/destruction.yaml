- id: mydei-hp-model
  entity: "1404"
  rule: U12
  status: completed
  category: engine-gap
  summary: >
    HP is not simulated, but HP loss is Mydei's Charge source. The kit tracks
    HP as a fraction of Max HP: Skill/Kingslayer consume their share of current
    HP, each enemy attack (aggro-weighted hitByEnemy) costs an assumed 10% Max
    HP, and the "sustained" toggle (selfHpAbove, default on) tops HP up to 80%
    at the start of his turns; his own heals (Vendetta entry, Ultimate, E4) are
    applied.
  detail: >
    Fixed: the hp counter, the `sustained` toggle, and the assumed 10% per
    hit are gone. Skill/Kingslayer consumeHp(hpRatio x #3); Vendetta entry,
    Ultimate, E4 (after an enemy hit, on hpChanged), and the killing-blow
    restore heal with ctx.heal (x Outgoing Healing). Charge = -delta x 100
    of every hpChanged loss (the event weight scales it; A6 ratio for
    hpCause enemy). E2 converts the restored share of every heal (the kit
    adds the part of his own heals beyond Max HP), with the tally reset
    after any action. A6's healing-received bonus boosts every heal. The
    killing-blow emulation (an enemy hit leaving him at the 1% floor during
    Vendetta) stays until engine-ally-killing-blow. Also added: the
    Ultimate's Taunt (#4 of 140403 turns) on the target and adjacent
    enemies, and Charge thresholds checked after teammates' actions.
- id: mydei-extra-turn-timing
  entity: "1404"
  rule: U11
  status: wont-do
  category: engine-gap
  summary: >
    "Immediately gains 1 extra turn" for Godslayer Be God is delayed when the
    threshold is crossed outside a turn (e.g. by the Ultimate's +20 Charge):
    the engine only processes extra turns after the next actor's turn.
  detail: >
    Fixed by engine-pass-wave1 ("extra turns from Ultimates waiting a
    turn"): an extra turn granted inside the Ultimate (its +20 Charge) runs

- id: saber-overflow-energy
  entity: "1014"
  rule: U10
  status: open
  category: engine-gap
  summary: >
    The engine caps Energy at max, so A4 overflow Energy is tracked in a kit
    counter: Saber's own Energy is granted in `after` (abilities set energy 0)
    with ERR estimated from the panel, and Gilgamesh's kit writes the counter
    for its Joint ATK Energy. Energy other kits or enemy hits give a full
    Saber is still lost.
  detail: >
    Blocked on engine-energy-received-event (Energy that enemy hits and
    other kits give a full Saber). Once an Energy-gained event with its
    overflow exists (one is in progress in battle.ts), add every overflow to
    the A4 counter (cap #1 of A2, #4 of E6) and drop the cross-kit counter
    written by 1509-gilgamesh.ts. Available now: `ctx.gainEnergy` returns
    the overflow after ERR, so `regenerate` can use it instead of the panel
    ERR estimate.

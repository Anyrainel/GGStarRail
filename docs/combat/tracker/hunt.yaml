- id: boothill-e6-multiplier
  entity: "1315"
  rule: C2
  status: open
  category: verify
  summary: >
    fribbels reads E6 as +40 percentage points on the Talent Break DMG
    multiplier, main target only. Our kit deals an extra 40% of the Talent's
    multiplier to the target and 70% to adjacent enemies. Which matches the
    game?
  detail: >
    The text reads "equal to 40% of the original DMG multiplier" /
    等同于原伤害倍率40%. If "original DMG" is the Talent Break DMG
    (70/120/170%), the text supports our kit: at 3 Pocket Trickshot the
    extra is 68% against fribbels' 40%, and at 1 stack 28% against 40%.
    Reading it as 40% of Boothill's base Physical Break DMG gives fribbels'
    value instead. fribbels does not model the adjacent 70% hits. Both apply
    the 16× Toughness cap to the extra DMG.
- id: ashveil-fua-hit-split
  entity: "1504"
  rule: C2
  status: open
  category: needs-data
  summary: >
    fribbels splits Ashveil's Talent Follow-Up ATK into 10 hits of 10%, and
    each extra 200% instance of the enhanced Follow-Up ATK into 10 more. Our
    kit deals each as one hit. What is the real split?
  detail: >
    It is not in the text or facts (150404 SingleAttack, Toughness 5). The
    split matters for per-hit Follow-Up ATK effects such as The Ashblazing
    Grand Duke 4pc. Toughness per hit is unknown, so keep the total of 5;

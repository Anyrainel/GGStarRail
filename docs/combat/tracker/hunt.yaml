  detail: >
    Toughness found: the pinned TurnBasedGameData ability config
    (Config/ConfigAbility/Avatar/Avatar_Mar_7th_10_Ability.json) gives the
    E2 Follow-Up a Basic-ATK stance x Normal_StanceRatio (the Shifu

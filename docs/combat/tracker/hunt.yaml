- id: archer-chain-queue
  entity: "1015"
  rule: C3
  status: actionable
  category: approximation
  summary: >
    Circuit Connection Skills are chained with queueAction, so Ultimates cannot
    be inserted between them and Follow-Ups triggered by one Skill resolve
    after the next chained Skill.
  detail: >
    Use `endsTurn: false` instead of queueing the next Skill. endsTurn is
    static, so declare two variants: `skill` (endsTurn: false) for a cast
    after which Circuit Connection continues, and `skillLast` (ends the
    turn) for the cast that exits it (the #5th cast, or when Skill Points
    after this cast, E1's refund included, cannot pay another Skill). The
    turn policy picks between them and `basic` (view.skillPoints, the
    circuit-casts counter, usedThisTurn); the actionEnd listener only clears
    Circuit Connection. Do with archer-skill-sp-cost.
- id: archer-ctx-sp-snapshot
  entity: "1015"
  rule: U10
  status: wont-do
  category: engine-gap
  summary: >
    Engine-wide: ActionContext spreads BattleApi, so ctx.skillPoints and
    ctx.cycle inside ability before/after are frozen at action start and miss
    gains made during the action; Archer decides his chain in an actionEnd
    listener instead.
  detail: >
    Fixed in engine-pass-wave1: ActionContext reads Skill Points and cycle
    live. The actionEnd decision can move into the abilities with
    archer-chain-queue.

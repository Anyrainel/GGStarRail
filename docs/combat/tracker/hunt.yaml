    (Imaginary Break effect), but applyToughness requires an Imaginary
    Weakness. Only matters when the scenario's Weakness list omits Imaginary.
  detail: >
    Within the API: compute the single-target hits with functional `hits`
    and set `toughnessWithoutWeakness: 1` when Shifu is designated and the
    target is weak to Shifu's Combat Type (EnemyView.weaknesses), on the
    Basic ATK, Enhanced Basic ATK, and E2 Follow-Up; the break uses

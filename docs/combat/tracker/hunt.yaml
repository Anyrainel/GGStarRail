    Destruction, The Hunt, Remembrance, or Elation teammate, else Nihility,
    else the first teammate.
  detail: >
    Blocked on engine-ally-option-vocabulary. Ally turn choices exist (see
    march-7th-skill-ally-target-event), but the player's Shifu choice needs
    an option that names a teammate; keep the heuristic until then.
- id: march-7th-a4-weakness
  entity: "1224"
  rule: U2
  status: actionable
  category: engine-gap
  summary: >

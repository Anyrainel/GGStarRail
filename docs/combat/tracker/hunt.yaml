  detail: >
    The initial hits are functional HitDefs with Shifu's Additional DMG after
    each (afterHit); the extra hits are dealt in `after` with weight chance^i,
    each followed by a Shifu Additional DMG of the same weight. Shifu's
    Toughness bonus applies only while Shifu is designated.
- id: topaz-debtor-crit
  entity: "1112"
  rule: U3
  status: completed
  category: engine-gap
  summary: >
    E1 Debtor raises the CRIT DMG of Follow-Up ATKs the enemy takes; there is
    no incoming CRIT DMG stat, so allies hold Follow-Up CRIT DMG mirroring the
    Proof of Debt target's Debtor stacks, which also reaches other enemies.
  detail: >
    Debtor is one status per stack (debtor-1 is the debuff, debtor-2 a
    marker), removed with Proof of Debt; allies get k.teamStat critDmg
    (Follow-Up) filtered by targetStatuses for each stack, replacing the
    debtorCritDmg mirror. A stack is added when a Follow-Up ATK on Proof of
    Debt starts: the ability config adds it OnBeforeBeingAttacked (Insert
    attacks, E1), so that attack already has it.

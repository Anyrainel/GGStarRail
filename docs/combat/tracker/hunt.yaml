- id: archer-chain-queue
  entity: "1015"
  rule: C3
  status: completed
  category: approximation
  summary: >
    Circuit Connection Skills are chained with queueAction, so Ultimates cannot
    be inserted between them and Follow-Ups triggered by one Skill resolve
    after the next chained Skill.
  detail: >
    Circuit Connection no longer queues Skills: `skill` has endsTurn: false
    and `skillLast` ends the turn and exits Circuit Connection. The turn
    policy picks `skillLast` for the 5th cast or when the Skill Points left
    after the cast (E1's refund included) cannot pay another Skill, so
    Ultimates can come between casts. A turnEnd listener clears Circuit
    Connection as a safety net.

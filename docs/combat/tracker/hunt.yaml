# Combat translation tracker: hunt. Schema: .agents/skills/hsr-combat/tracking.md
- id: yanqing-sss-removal
  entity: "1209"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Soulsteel Sync is removed by enemy hits with Yanqing's base Rogue aggro
    share (expected value held in fractional stacks); kits cannot lower aggro
    while it is active, and shields that absorb the hit (which keep it in game)
    are not modeled, so it falls off more often than in shielded teams.
  detail: >
    Blocked on engine-aggro-modifiers. In the pinned TurnBasedGameData
    ability config
    (Config/ConfigAbility/Avatar/Avatar_Yanqing_00_Ability.json) Soulsteel
    Sync lowers his AggroBase by 60% while held and is removed by any HP
    decrease (OnHPChange), so Shields that absorb the hit keep it
    (engine-shield-state). Once kits can change aggro: apply −60% aggro with
    the status, and remove it on hpChanged with delta < 0 (weighted), which
    also covers HP consumed by allies.
- id: yanqing-freeze-status
  entity: "1209"
  rule: U4
  status: open
  category: engine-gap
  summary: >
    Talent Freeze is a DotDef status: its Ice Additional DMG tick is tagged
    `dot` (DoT boosts apply, Kafka-style detonation triggers it), and the
    Frozen enemy still takes its turn because only Break Frozen skips turns.
  detail: >
    Blocked on engine-control-turn-start-dmg (turn-start Additional DMG on a
    status that is not a DoT, scaled by its landing chance). Once it exists:
    Freeze is a debuff with family "frozen" and skipsTurn, applied with the
    Follow-Up's weight folded into its chance, its tick tagged additional
    only (no dot tag, no detonation). Adding skipsTurn to the current DotDef
    now would skip at the full 65% even when the Follow-Up itself is
    probabilistic.
- id: yanqing-a6-crit-trigger
  entity: "1209"
  rule: U8
  status: open
  category: approximation
  summary: >
    A6 Gentle Blade (SPD on CRIT Hit) is applied after every attack because
    CRIT is evaluated in expectation and the engine has no CRIT event.
  detail: >
    Needs a decision. The game triggers A6 per CRIT hit (M_Yanqing_Tree03,
    OnAfterHit + ByIsDamageCritical in the pinned TurnBasedGameData ability
    config (Config/ConfigAbility/Avatar/Avatar_Yanqing_00_Ability.json)),
    and his attacks have several hits (Basic 50/25/25%, Skill 4 x 25%,
    Follow-Up 30/70%). Options: (a) keep every attack counting as a CRIT;
    (b) apply Gentle Blade with stacks 1 − (1 − s)(1 − CR)^hits, reading
    CRIT Rate in the handler, which makes the timeline depend on CRIT Rate,
    and his own CRIT buffs (Soulsteel Sync, Ultimate) are timed statuses
    that panelStat leaves out (engine-momentary-stat-read).
- id: yanqing-e1-freeze-chance
  entity: "1209"
  rule: U9
  status: open
  category: approximation
  summary: >
    E1 Additional DMG on Frozen enemies scales by the expected presence of
    Yanqing's own Freeze (Follow-Up chance) but ignores the debuff's landing
    chance (65% base vs Effect RES), overstating it; Break Frozen counts fully.
  detail: >
    Blocked on engine-debuff-landing-chance (it names Yanqing's Freezes):
    E1's Additional DMG should be scaled by the target's Frozen landing
    chance, and check family "frozen" so Break Frozen and other Freezes
    count.
- id: yanqing-sss-timing
  entity: "1209"
  rule: C2
  status: actionable
  category: bug
  summary: >
    Soulsteel Sync is applied after the Skill DMG (text order), so the Skill
    hit only benefits from a still-active previous one; the Talent Follow-Up
    is gated on Soulsteel Sync. Confirm both in game.
  detail: >
    Settled by the pinned TurnBasedGameData ability config
    (Config/ConfigAbility/Avatar/Avatar_Yanqing_00_Ability.json): Soulsteel
    Sync is added OnAfterSkillUse (after the Skill's DMG, as the kit does),
    but the Follow-Up chance is rolled OnBeforeAttack by the Soulsteel Sync
    modifier itself (Normal, BPSkill, and Ultra attacks), so an attack only
    triggers the Follow-Up if Soulsteel Sync was held before it. Kit change:
    read the Soulsteel Sync stacks at actionStart and queue the Follow-Up at
    actionEnd with that value, so the Skill that first applies it does not
    trigger one.
- id: yanqing-e6-kill-toggle
  entity: "1209"
  rule: U8
  status: open
  category: approximation
  summary: >
    E6 (extend buffs on kill) is a toggle, default off; when on, Soulsteel
    Sync and the Ultimate buffs simply last 1 extra turn.
  detail: >
    Blocked on engine-kill-triggers. Meanwhile the enemyDefeated option
    (default off) follows U8; with kills, E6 would `extendStatus` Soulsteel
    Sync and the Ultimate buffs by 1 turn when an enemy is defeated while
    they are active.

- id: march-7th-enhanced-hits
  entity: "1224"
  rule: U9
  status: actionable
  category: approximation
  summary: >
    Enhanced Basic ATK extra hits are expected values: the i-th extra hit
    carries chance^i in its multiplier, Toughness, and Shifu Additional DMG,
    so per-hit triggers see three full instances. The Harmony/Nihility/
    Preservation/Abundance Shifu bonus multiplies each hit's Toughness
    (not Break Efficiency) and is also present before Shifu is designated.
  detail: >
    Deal the extra hits in `after` with `ctx.deal(hit, { weight: chance^i
    })` (the Shifu Additional DMG with the same weight), so per-hit effects
    see weighted instances, and apply Shifu's Toughness bonus only while
    Shifu is designated (functional `hits`).
- id: topaz-debtor-crit
  entity: "1112"
  rule: U3
  status: actionable
  category: engine-gap
  summary: >
    E1 Debtor raises the CRIT DMG of Follow-Up ATKs the enemy takes; there is
    no incoming CRIT DMG stat, so allies hold Follow-Up CRIT DMG mirroring the
    Proof of Debt target's Debtor stacks, which also reaches other enemies.
  detail: >
    Target filters exist. Map Debtor's 2 stacks to two statuses (debtor-1,
    debtor-2; the second applied at 2 stacks, both removed with Proof of
    Debt) and give allies `k.teamStat("e1", { stat: "critDmg", value:
    k.rankParam(1, 1), filter: { tags: ["followUp"], targetStatuses:
    [debtorN.id] } })` for each, replacing debtorCritDmg.
- id: topaz-numby-handle
  entity: "1112"
  rule: C5
  status: actionable
  category: engine-gap
  summary: >
    BattleApi cannot look up a kit's summons (ctx.summon resets an existing
    one's gauge), so Numby is summoned at battle start and its view kept in a
    closure for Action Advance. Numby's turn also attacks the engine's main
    target; the kit keeps Proof of Debt there.
  detail: >
    `ctx.findSummon(ctx.self, numbyDef.id)` replaces the closure handle.
    Numby's policy can return `{ ability: "numbyFollowUp", target: <the
    Proof of Debt enemy> }` (turn choices accept an enemy target), so Proof
    of Debt need not sit on the main target.

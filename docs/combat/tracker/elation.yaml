- id: evanescia-energy-sources
  entity: "1505"
  rule: U10
  status: completed
  category: approximation
  summary: >
    The Talent's Energy to Certified Banger conversion and the Master Fox
    accumulation only see Energy the kit regenerates itself (ability Energy is
    set to 0 and regenerated in `after` with the facts values, plus Master Fox,
    E6, and conversions). Energy from enemy hits and teammates is missed.
  detail: >
    The Talent listens to `energyGained` (self): every gain, from any
    source (abilities, enemy hits, teammates), grants as much Certified
    Banger and counts toward Master Fox (up to 240 per gain). Energy
    converted from Certified Banger is marked with a counter while it is
    gained, so it counts toward Master Fox but does not convert back. The
    abilities' own Energy is restored (kind defaults; Master Fox's
    follow-up regenerates #4 = 10).

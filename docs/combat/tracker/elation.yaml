- id: silver-wolf-lv999-loot-box
  entity: "1506"
  rule: U9
  status: open
  category: approximation
  summary: >
    The Zone's Top Loot Box chance is tracked as its expected value (mean
    field) and reset to 100% on each Godmode entry (assumption). Each random
    effect has a 1/3 share; Big Flipping Sword's 20% True DMG is folded into
    the multiplier. The Enhanced Basic ATK's 3 boxes are certain and leave
    the chance unchanged.
  detail: >
    E2 extra turns from chance-weighted Hidden MMR gains are granted at the
    next whole gain or at the end of an Enhanced Basic ATK.

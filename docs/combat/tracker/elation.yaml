- id: trailblazer-elation-ult-punchline
  entity: "8009"
  rule: C2
  status: open
  category: engine-gap
  summary: >
    The Ultimate makes the designated ally use their Elation Skill with a fixed
    20 Punchline. A queued Elation Skill from another kit reads the team's
    Punchline instead; only a self-designated Ultimate uses the fixed amount.
  detail: >
    Blocked on engine-queued-action-options. ahaExtraTurn does not fit (it
    runs every participant and grants Certified Banger). Once queueAction can

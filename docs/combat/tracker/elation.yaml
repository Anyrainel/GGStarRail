- id: yao-guang-aha-extra-turn
  entity: "1502"
  rule: C1
  status: open
  category: engine-gap
  summary: >
    The Ultimate's Aha extra turn (fixed 20 Punchline, 40 at E1, consumes
    none) has no engine construct. The kit queues every Elation Character's
    Elation Skill, then grants Certified Banger worth the fixed amount.
  detail: >
    Inaccuracies: the queued Elation Skills read the team Punchline, not the
    fixed amount; ahaInstantStart/ahaInstantEnd do not fire (Sparxie E1/E2);
    E4's "Elation Skill DMG becomes 150%" is a status filtered on the
    `elation` tag, so Great Boon and other Elation procs in that window are
    also boosted. Needs something like grantAhaExtraTurn({ punchline, consume:
    false }) that runs a real Aha Instant and tells kits which Ultimate
    granted it.
- id: yao-guang-a6-banger-duration
  entity: "1502"
  rule: U5
  status: open
  category: engine-gap
  summary: >
    A6 extends each Certified Banger Yao Guang gains by 1 turn. The engine
    grants Aha Instant bangers directly (2 turns), with no gain event or way
    to extend them, so A6 applies only to the bangers her emulated Aha extra
    turn grants.
  detail: ""
- id: yao-guang-great-boon-stats
  entity: "1502"
  rule: U7
  status: open
  category: approximation
  summary: >
    Great Boon deals Elation DMG of the attacker's Type with Yao Guang's
    stats. The text uses the attacker's stats and swaps in Yao Guang's
    Elation only when it is higher; a stat maximum across two units cannot
    be expressed.
  detail: >
    Usually Yao Guang has the highest Elation, so the Elation term is right
    and CRIT and Merrymake come from her instead of the attacker.

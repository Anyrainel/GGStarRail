- id: pearl-banger-rules
  entity: "1503"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Pearl's Certified Banger lasts indefinitely, caps at 50, and is spent as
    Repellency. The kit caps its own grants, but Aha Instant bangers (2 turns)
    stack past the cap, and Repellency spending is not simulated. Starry
    Night's Elation DMG therefore sees a high Punchline (over 100 in a full
    Elation team).
  detail: >
    Blocked on engine-banger-holder-rules. The 4-Elation extra turn's 30
    Certified Banger is granted at Ultimate time for 1 turn so it expires with
    the extra turn, because a banger cannot be removed at turn end. Once
    per-holder rules exist, set Pearl's cap (50) and no expiry, spend
    Repellency by removing banger value, and remove the extra turn's banger
    when it ends.
- id: pearl-elation-targets
  entity: "1503"
  rule: C2
  status: open
  category: verify
  summary: >
    Several Elation DMG instances name no target. Starry Night's 15%, the
    Ultimate's 60%, and E6's 240% (from the Aesthetic Archetype's stats) are

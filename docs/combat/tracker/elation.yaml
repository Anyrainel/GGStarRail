- id: trailblazer-elation-readings
  entity: "8009"
  rule: C2
  status: actionable
  category: bug
  summary: >
    A6's +2 Certified Banger accumulates once per ally Elation Skill until the
    next Skill; the game grants a flat +2 once, before the Skill's damage.
  detail: >
    Avatar_PlayerBoy_40: an ally Elation Skill adds one mark
    (MAvatar_Player_40_PointB3_P1Mark, OnListenAfterSkillUse, no stacking);
    the next Skill (Skill02_Phase02) consumes it for +#1 (2) Certified Banger
    before its damage. Replace the counter with a flag worth +2 once, granted
    before the Skill's hits. The Talent reading is right: the Skill deals its
    hit, then the Talent's Elation DMG if Trailblazer holds Certified Banger,
    then gains the Skill's own 20; A6's +2 counts for that check.

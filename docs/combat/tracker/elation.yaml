    with Punchline 20.
- id: trailblazer-elation-ult-target
  entity: "8009"
  rule: U8
  status: completed
  category: approximation
  summary: >
    The Ultimate's designated ally is the first Elation teammate, else the
    first damage dealer, else a Nihility teammate, else the first teammate.
    "Has an Elation Skill" is read as the Elation Path.
  detail: >
    The designated ally comes from an `ultimate-target` option (k.ally,
    includeSelf) with the old heuristic as its default (first Elation
    teammate, else the first damage dealer, else a Nihility teammate, else
    the first teammate). The Ultimate policy returns { ability:
    "ultimate", target } and the Ultimate reads ctx.target. "Has an
    Elation Skill" is still read as the Elation Path.
- id: trailblazer-elation-readings
  entity: "8009"
  rule: C2
  status: completed
  category: bug
  summary: >
    A6's +2 Certified Banger accumulates once per ally Elation Skill until the
    next Skill; the game grants a flat +2 once, before the Skill's damage.
  detail: >
    A6 is a mark (counter capped at 1, weighted by the Elation Skill's
    probability) set after any ally Elation Skill. The Skill's `before`
    spends it for +2 Certified Banger, so it counts for the Talent's check
    and Punchline; the Skill's own 20 is granted after its DMG.
- id: evanescia-banger-conversions

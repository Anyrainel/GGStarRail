# Combat translation tracker: elation. Schema: .agents/skills/hsr-combat/tracking.md
- id: sparxie-farming-odds
  entity: "1501"
  rule: U9
  status: open
  category: approximation
  summary: >
    Engagement Farming is played as "farm while Thrill or Skill Points remain,
    up to 20 triggers". The Skill queues each further trigger weighted by its
    probability under that policy (a random walk on SP), with gift odds
    assumed 50/50 and each gift at its expected value.
  detail: >
    farmingOdds() in the kit computes the odds from the Skill Points and Thrill
    at Skill time (fractional values mixed between floor and ceil). From 2 SP
    with a 5 SP cap this averages about 10.6 triggers. The game draws the gift
    with RPG.GameCore.RandomConfig over two dynamic odds (keys 1534702343 and
    -361545546, not in the text) and forces the Grand Prize under a condition
    checked first; the odds values are still unknown. A reserve for
    teammates would change the count.
- id: sparxie-thrill-sp-event
  entity: "1501"
  rule: U10
  status: open
  category: engine-gap
  summary: >
    Thrill is a kit counter spent through separate `skillThrill`/`farmThrill`
    abilities. "Consuming Thrill is considered as consuming Skill Points", but
    spending it emits no skillPointsChanged, so other kits' SP-consumption
    triggers miss it.
  detail: >
    Blocked on engine-sp-equivalent-spend. Once a kit can report a spend as
    Skill Point consumption, report each Thrill spent so `skillPointsChanged`
    listeners (Yao Guang's Great Boon, Sparkle) see it.
- id: sparxie-elation-toughness
  entity: "1501"
  rule: U1
  status: completed
  category: bug
  summary: >
    The Talent's 5 Toughness is put on the Enhanced Basic ATK's main-target
    Elation hit; the game puts it on each Engagement Farming instance.
  detail: >
    The Talent's main/adjacent Elation hit on the Enhanced Basic ATK
    carries no Toughness, and each per-farm Elation instance (the bounce
    dealt after the Enhanced Basic ATK) carries 5. More Toughness lands
    per Enhanced Basic ATK, so the enemies break earlier in the kit check
    (E0 team damage +2%).
- id: yao-guang-aha-extra-turn
  entity: "1502"
  rule: C1
  status: completed
  category: engine-gap
  summary: >
    The Ultimate's Aha extra turn (fixed 20 Punchline, 40 at E1, consumes
    none) is emulated: the kit queues every Elation Character's Elation Skill
    (reading the team Punchline), then grants Certified Banger worth the
    fixed amount; ahaInstantStart/ahaInstantEnd do not fire.
  detail: >
    The Ultimate's `after` calls `ctx.ahaExtraTurn(fixedPunchline)` (20,
    40 at E1); the queued Elation Skills and the `ahaExtraTurn` ability
    are gone. E4: the Ultimate sets a pending counter; the next
    `ahaInstantStart` with `extraTurn` applies Feathered Fortune to the
    ally Characters and `ahaInstantEnd` removes it (Great Boon inside that
    window is boosted too). A6's +1 turn now reaches no Certified Banger
    (see yao-guang-a6-banger-duration).
- id: yao-guang-a6-banger-duration
  entity: "1502"
  rule: U5
  status: open
  category: engine-gap
  summary: >
    A6 extends each Certified Banger Yao Guang gains by 1 turn. The engine
    grants Aha Instant bangers directly (2 turns), including those of her
    Ultimate's Aha extra turn, with no gain event or way to extend them,
    so A6 has no effect.
  detail: >
    Blocked on engine-elation-banger-events. Once a per-holder banger
    duration bonus exists, give Yao Guang +1 turn on every banger she gains.
- id: yao-guang-great-boon-stats
  entity: "1502"
  rule: U7
  status: open
  category: approximation
  summary: >
    Great Boon deals Elation DMG of the attacker's Type with Yao Guang's
    stats. The text uses the attacker's stats and swaps in Yao Guang's
    Elation only when it is higher; a stat maximum across two units cannot
    be expressed.
  detail: >
    Blocked on engine-mixed-attacker-stats. Usually Yao Guang has the highest
    Elation, so the Elation term is right and CRIT and Merrymake come from her
    instead of the attacker. Once a hit can take the attacker's stats with
    max(attacker, Yao Guang) Elation, deal Great Boon that way.
- id: pearl-missing-facts

- id: pearl-healing
  entity: "1503"
  rule: U12
  status: completed
  category: missing-ability
  summary: >
    Pearl's heals (Skill, both Enhanced Basic ATKs) and A2's Outgoing
    Healing Boost were not modeled, and her policy assumed healing was not
    simulated.
  detail: >
    The Skill and Enhanced Basic ATKs heal every ally target (#2 of DEF +
    #3/#4, times 1 + Outgoing Healing) and the ally with the lowest HP
    share (chosen before the first heal) again. A2's Outgoing Healing
    Boost (20% of Elation) is three holder-scaled modifiers: base Elation,
    plus the DEF-based A2 Elation repeated in DEF terms, since scaling
    never reads scaling. The Skill is also used when an ally Character is
    at 50% HP or lower (the Talent's threshold). The Talent's damage
    reduction, A4's cleanse, and E1's revive stay unmodeled (U12).

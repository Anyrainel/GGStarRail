# Combat translation tracker: elation. Schema: .agents/skills/hsr-combat/tracking.md
- id: sparxie-farming-odds
  entity: "1501"
  rule: U9
  status: open
  category: approximation
  summary: >
    Engagement Farming is played as "farm while Thrill or Skill Points remain,
    up to 20 triggers". The Skill queues each further trigger weighted by its
    probability under that policy (a random walk on SP), with gift odds
    assumed 50/50 and each gift at its expected value.
  detail: >
    farmingOdds() in the kit computes the odds from the Skill Points and Thrill
    at Skill time (fractional values mixed between floor and ceil). From 2 SP
    with a 5 SP cap this averages about 10.6 triggers. Real gift weights and a
    reserve for teammates would change the count.
- id: sparxie-thrill-sp-event
  entity: "1501"
  rule: U10
  status: open
  category: approximation
  summary: >
    Thrill is a kit counter spent through separate `skillThrill`/`farmThrill`
    abilities. "Consuming Thrill is considered as consuming Skill Points", but
    spending it emits no skillPointsChanged, so other kits' SP-consumption
    triggers miss it.
  detail: ""

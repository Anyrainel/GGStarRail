  rule: C2
  status: open
  category: verify
  summary: >
    E6's Max-HP-scaled Physical DMG is a silent second scaling part of the
    Basic ATK instance; confirm it is not a separate damage instance.
  detail: ""
- id: lynx-survival-response-target
  entity: "1110"
  rule: C3
  status: open
  category: approximation
  summary: >
    Survival Response goes to a heuristic carry (Destruction, then other damage
    Paths, then Nihility, then the highest Max HP) and is renewed when missing;
    the player's actual target cannot be expressed (see engine-ally-option-vocabulary).
  detail: ""
- id: lynx-survival-response-aggro
  entity: "1110"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Survival Response's aggro increase on Destruction/Preservation targets is
    not modelled, so A2's Energy from hits on the target uses its base aggro
    share (see engine-aggro-modifiers).
  detail: ""
- id: luocha-auto-skill
  entity: "1203"
  rule: U8
  status: open
  category: approximation
  summary: >
    The Skill's automatic trigger at 50% ally HP is an option (default off);
    when on, every enemy attack off cooldown triggers it, the 2-turn cooldown
    counts Luocha's turn ends, and it regenerates no Energy (see engine-hp-model).
  detail: ""
- id: luocha-zone-stacks
  entity: "1203"
  rule: U5
  status: open
  category: verify
  summary: >
    The Zone (and E1's ATK bonus) counts down on Luocha's turn ends, and Abyss
    Flower stacks are still gained while the Zone is active, refreshing it at 2
    stacks; confirm both in game.
  detail: ""
- id: bailu-invigoration-counters
  entity: "1211"
  rule: U12
  status: open
  category: approximation
  summary: >
    Invigoration is tracked as per-Character counters (turns and heals) and
    ends only when its duration runs out, not when its heals are used up. A2
    (overheal) and E1 (full HP at the end) are HP options (default on), and
    Skill heals on random allies are expected values (see engine-status-lifecycle).
  detail: ""

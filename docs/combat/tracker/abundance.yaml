- id: natasha-skill-policy
  entity: "1105"
  rule: C3
  status: open
  category: approximation
  summary: >
    HP is not simulated, so Natasha uses Basic ATK and only Skills when a Basic
    ATK would overflow the Skill Point cap; real play spends Skill Points on
    heals as damage comes in (see engine-hp-model).
  detail: ""
- id: natasha-e6-instance

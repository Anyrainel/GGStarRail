- id: bailu-talent-killing-blow
  entity: "1211"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    The Talent's heal on a teammate receiving a killing blow (once per battle,
    +1 with E6) never triggers, because the HP model keeps allies at 1% HP or
    more.
  detail: >
    Blocked on engine-ally-killing-blow. Once a killing-blow event exists,
    Bailu answers it for a teammate: the ally is not knocked down and heals
    (Talent #3 x Bailu's Max HP + #4), up to 1 time per battle (E6: #1 more).

# Combat translation tracker: abundance. Schema: .agents/skills/hsr-combat/tracking.md
- id: natasha-skill-policy
  entity: "1105"
  rule: C3
  status: completed
  category: approximation
  summary: >
    HP was not simulated, so Natasha uses Basic ATK and only Skills when a
    Basic ATK would overflow the Skill Point cap; real play spends Skill
    Points on heals as damage comes in.
  detail: >
    Natasha heals through ctx.heal: (ratio x her panel Max HP + flat) x (1 +
    Outgoing Healing, A4 included, + the Talent's #2 when the target is at #1
    HP or lower) / the target's panel Max HP. Skill: immediate heal (#1, #4)
    and a continuous-healing status (#3 turns, +1 with A6) that heals (#2,
    #5) at the start of the holder's turns. Ultimate: heals all allies (#1,
    #2); E2 gives allies at #1 HP or lower its continuous healing (checked
    before the heal). E1: hpChanged (hpCause enemy) on Natasha at 30% HP or
    lower heals her, once per battle as weighted triggers adding up to one.
    Turn policy: Skill on the ally Character with the lowest hpRatio when it
    is at 50% or lower, else on a Skill Point overflow; Basic ATK otherwise.
- id: natasha-e6-instance
  entity: "1105"
  rule: C2
  status: completed
  category: bug
  summary: >
    E6's Max-HP-scaled Physical DMG is a silent second scaling part of the
    Basic ATK instance; the game deals it as a separate damage instance.
  detail: >
    E6 is its own HitDef after the Basic ATK's hit (stat hp, no Toughness,
    not silent).
- id: lynx-survival-response-target
  entity: "1110"
  rule: C3
  status: completed
  category: approximation
  summary: >
    Survival Response goes to a heuristic carry (Destruction, then other damage
    Paths, then Nihility, then the highest Max HP) and is renewed when missing;
    the player's actual target cannot be expressed.
  detail: >
    Survival Response goes to a teammate chosen with k.ally
    ("survival-response-target", Lynx included); the default is the Path
    heuristic on the team (Destruction, other damage Paths, Nihility, then
    the earliest slot). The turn policy keeps it on that ally (Skill when it
    lacks it or Skill Points would overflow) after healing a low ally.
- id: lynx-survival-response-aggro
  entity: "1110"
  rule: U12
  status: completed
  category: engine-gap
  summary: >
    Survival Response's aggro increase on Destruction/Preservation targets is
    not modelled, so A2's Energy from hits on the target uses its base aggro
    share.
  detail: >
    Destruction and Preservation targets also receive a companion status with
    aggroPct = Skill #6 (+500%) for Survival Response's duration, so enemy
    attacks (and A2's Energy) follow it.
- id: luocha-auto-skill
  entity: "1203"
  rule: U8
  status: completed
  category: approximation
  summary: >
    The Skill's automatic trigger at 50% ally HP is an option (default off);
    when on, every enemy attack off cooldown triggers it, the 2-turn cooldown
    counts Luocha's turn ends, and it regenerates no Energy.
  detail: >
    The option is gone. hpChanged (subject ally, delta < 0, the ally's
    hpRatio <= #3, no cooldown status) applies the Skill's effect to that
    ally without Skill Points or Energy. Each trigger counts with the loss's
    weight (an aggro share); once the triggers add up to one, a #4-turn
    cooldown status starts on Luocha (counted on his turn ends). Every heal
    (manual and automatic Skill, the Zone's heal on the attacker, A4's heal
    on the other allies) calls ctx.heal with (ratio x Luocha's panel ATK +
    flat) x (1 + Outgoing Healing) / the target's panel Max HP; E2 adds its
    Outgoing Healing on targets below 50% and otherwise gives a 2-turn
    status of the shield family. Turn policy: Skill on the ally Character
    with the lowest hpRatio when it is at 50% or lower or (E1) when it
    completes a missing Zone.
- id: luocha-zone-stacks
  entity: "1203"
  rule: U5
  status: completed
  category: bug
  summary: >
    Abyss Flower stacks are still gained while the Zone is active, refreshing
    it at 2 stacks; the game gives no Abyss Flower while the Zone exists.
  detail: >
    Skill, automatic Skill, and Ultimate gain no Abyss Flower while the Zone
    is on Luocha.
- id: bailu-invigoration-counters
  entity: "1211"
  rule: U12
  status: completed
  category: approximation
  summary: >
    Invigoration is tracked as per-Character counters (turns and heals) and
    ends only when its duration runs out, not when its heals are used up. A2
    (overheal) and E1 (full HP at the end) are HP options, and Skill heals on
    random allies are expected values.
  detail: >
    Invigoration is a unique 2-turn status whose stacks are its remaining
    heals (#5, +1 with A4). The Ultimate heals all allies (#1, #2), applies
    it to allies without it and extends it by 1 turn on holders. On
    hpChanged (hpCause enemy, after the HP loss) a holder heals (Talent #1,
    #2) and loses the hit's weight in stacks; it is removed at 0. E1: on
    statusRemoved, a Character at full HP regenerates #1 fixed Energy. A2:
    a heal whose amount exceeds the missing HP applies the Max HP status
    (weighted). E2's Outgoing Healing status is added to heal amounts. The
    HP options and counters are gone.
- id: bailu-skill-policy
  entity: "1211"
  rule: C3
  status: completed
  category: approximation
  summary: >
    HP was not simulated, so Bailu uses Basic ATK; at E4 she Skills with 3+
    Skill Points on the lowest-slot teammate for Evil Excision.
  detail: >
    Skill on the ally Character with the lowest hpRatio when it is at 50% or
    lower; else, at E4, Skill with 3+ Skill Points on a teammate chosen with
    k.ally ("evil-excision-target", default the first damage-Path teammate,
    then Nihility); else Basic ATK. The Skill heals the target (#1, #2),
    then #4 random heals, each (1 - #3) times the last, spread over all
    ally targets as expected values.

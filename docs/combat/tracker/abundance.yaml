- id: huohuo-skill-target
  entity: "1217"
  rule: C3
  status: completed
  category: approximation
  summary: >
    The Skill targets the Character whose heal also reaches the most adjacent
    allies by slot, ignoring who needs healing.
  detail: >
    The Skill aims at the ally Character with the lowest hpRatio (ties: the
    adjacency rule) and heals it (#1, #2) and adjacent Characters (#3, #4)
    with ctx.heal. Huohuo also Skills when that ally is at 50% HP or lower.
    The Talent heals the triggering ally and each ally at #6 HP or lower,
    E4 adds up to #1 Outgoing Healing linearly with HP lost, and E6 buffs
    every healed ally. No designated target is needed: E6 reaches every
    ally through the Talent's turn-start heals.
- id: lingsha-a6-low-hp
  entity: "1222"
  rule: U8
  status: completed
  category: approximation
  summary: >
    A6's extra Fuyuan attack is an HP option (default off); when on, every
    enemy attack while Fuyuan is present and off cooldown queues it, and the
    2-turn cooldown counts Lingsha's turn ends.
  detail: >
    The option is gone. hpChanged (an ally Character losing HP to an enemy
    or a cost, Fuyuan present, no cooldown status) queues Fuyuan's
    embers-echo (no action used) when any ally Character is at #1 HP or
    lower, then applies a #2-turn cooldown status on Lingsha. An enemy
    attack always damages some Character, so the follow-up is queued at
    full weight. Skill, Ultimate, and every Fuyuan attack heal all allies
    with ctx.heal (Lingsha's panel ATK; A2's Outgoing Healing from Break
    Effect added), and E4 heals the ally with the lowest current HP when
    Fuyuan takes its own action.

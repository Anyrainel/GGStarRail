- id: lingsha-heal-a2-atk
  entity: "1222"
  rule: U7
  status: open
  category: engine-gap
  summary: >
    Lingsha's heal amounts read her panel ATK, which leaves out A2's ATK from
    Break Effect (a scaled permanent modifier), so her heals (and Fuyuan's)
    are too small when A2 is active.
  detail: >
    Blocked on engine-momentary-stat-read. A stat read that includes scaled
    modifiers would give the heals Lingsha's full ATK. A2's Outgoing Healing
    share is already added to the heal amount by hand.
- id: lingsha-e1-before-break
  entity: "1222"
  rule: U3
  status: open
  category: engine-gap
  summary: >
    E1's DEF reduction is added on weaknessBreak, which the engine emits after
    the breaking hit's Break DMG; the game adds it OnBeforeBeingBreak, so
    that Break DMG already sees it.
  detail: >
    Blocked on engine-before-break-event. Apply the status from a hook that
    runs when Toughness reaches 0, before the Break DMG resolves.

- id: hyacine-healing-tally
  entity: "1409"
  rule: U12
  status: completed
  category: approximation
  summary: >
    The healing tally is computed from the heal formulas and Little Ica heals
    only after enemy attacks, never running out of HP; teammates' HP costs do
    not trigger Ica's healing or E2.
  detail: >
    All heals call ctx.heal with the share of the target's Max HP (Little
    Ica's is Talent #1 x Hyacine's; After Rain's Max HP is added by hand),
    from Hyacine's Max HP (After Rain and A6 included) and Outgoing Healing
    (A6's excess SPD, A2's +25% when the target's hpRatio <= 50%; the
    a2-low-hp-healing toggle is gone). Little Ica heals each ally target whose
    HP drops (hpChanged consume or enemy, at the loss's weight); its 4% HP
    cost, the After Rain heal for all ally targets, and the Talent stack
    follow once at the next turn start or action end. E2's SPD follows the
    same hpChanged events, and E6's RES PEN uses summoned/departed. The tally
    still adds the requested amounts (hyacine-tally-overheal). Fall, Then Take
    Wing still cannot trigger (hyacine-ica-departure).
- id: evernight-evey-hp-loss
  entity: "1413"
  rule: U12
  status: open
  category: approximation
  summary: >
    Talent HP-loss triggers (CRIT DMG, +2 Memoria) come from enemy attacks
    on Evernight (her aggro share) and her own HP costs. Enemy attacks on
    Evey, who draws more aggro, are not modeled, so Memoria is underestimated.
  detail: >
    Blocked on engine-memosprite-enemy-targets. Evernight's own losses and any
    HP Evey loses to costs (Castorice's Skills) already trigger the Talent
    through hpChanged; once enemy attacks can hit memosprites by aggro (Evey's
    "increased chance of getting attacked" as aggroPct, value not in the

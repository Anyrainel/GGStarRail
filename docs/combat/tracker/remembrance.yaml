- id: evernight-hp-cost-triggers
  entity: "1413"
  rule: U12
  status: actionable
  category: bug
  summary: >
    The Skill's 10% HP cost and A2's 5% HP cost are counted as one Talent
    HP-loss trigger per ability use; the game triggers the Talent on each HP
    decrease outside received attacks.
  detail: >
    Avatar_Evernight_00_Ability, MAvatar_Evernight_00_HPChange (OnHPChange):
    every HP decrease triggers the Talent unless it happens during a received
    attack, which triggers once per attack. Use the HP model:
    `ctx.consumeHp(self, hpRatio x #6)` for the Skill and `ctx.consumeHp(self,
    hpRatio x A2 #2)` for A2, and trigger the Talent (+2 Memoria, +2 more with
    E2, CRIT DMG refresh) from `hpChanged` with hpCause "consume" for each
    cost separately, and from `hitByEnemy` (aggro weight) once per enemy
    attack on Evernight, not from hpChanged "enemy", which fires for every
    ally on every attack.

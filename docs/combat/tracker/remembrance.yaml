# Combat translation tracker: remembrance. Schema: .agents/skills/hsr-combat/tracking.md
- id: aglaea-seam-stitch-debuff
  entity: "1402"
  rule: U3
  status: open
  category: verify
  summary: >
    Seam Stitch is modeled as a debuff on the enemy (the text says "inflicts
    the target with the Seam Stitch state"; guides disagree). It is reapplied
    by every Aglaea attack, so it feeds debuff counts and on-debuff triggers.
  detail: ""
- id: aglaea-seam-stitch-attackers
  entity: "1402"
  rule: C1
  status: open
  category: verify
  summary: >
    The Talent's Additional DMG (and E1 Energy) triggers after attacks by
    Aglaea or Garmentmaker on the Seam Stitch target, once per action; the
    Joint ATK triggers it once. The text names no attacker for this part.
  detail: ""
- id: aglaea-joint-atk-split
  entity: "1402"
  rule: C2
  status: open
  category: needs-data
  summary: >
    Slash by a Thousandfold Kiss: the facts' Toughness (20/10) is put on
    Aglaea's part, and Garmentmaker's part is tagged Basic ATK, Joint ATK,
    and memosprite DMG. The per-part Toughness split and DMG types are not in
    the data.
  detail: ""
- id: castorice-max-newbud
  entity: "1407"
  rule: U1
  status: open
  category: needs-data
  summary: >
    Max Newbud (and Netherwing's Max HP) is hard-coded to 34,000, the
    community value for level-80 teams (5.3125 × level²). The text only says
    it depends on the Characters' levels; lower-level teams get less.
  detail: ""
- id: castorice-hp-model
  entity: "1407"
  rule: U12
  status: open
  category: approximation
  summary: >
    HP is not simulated. Newbud and Netherwing's HP come from assumed losses:
    allies (Characters only) at 80% HP when the Skills consume HP, 10% Max HP
    per enemy attack, and with A2 the sustain's healing restoring each loss
    (toggle healing-converted, capped per ally). Teammates' HP costs and heals,
    E4, and Mooncocoon's 1-HP floor are not seen.
  detail: >
    An engine HP model (engine-hp-model) with heal and HP-loss events would
    replace the assumptions; reading allies' panel HP already scales the
    amounts with their Max HP.
- id: castorice-netherwing-policy
  entity: "1407"
  rule: C3
  status: open
  category: verify
  summary: >
    Netherwing uses Breath while its HP stays above 25% (and with Ardent
    Will), Claw to end its first two turns, and on its third turn Breathes
    down to Wings Sweep the Ruins. Wings triggers once per departure: the
    low-HP Breath replaces Breath with Wings, and expiry deals it otherwise.
  detail: "Confirm common play (some players dump all HP on the first turn) and that a low-HP Breath does not also trigger the Talent Wings."
- id: castorice-territory-debuff
  entity: "1407"
  rule: U3
  status: open
  category: verify
  summary: >
    Lost Netherland's All-Type RES reduction is held by every enemy as a
    non-debuff status (a Territory), so it does not count toward debuff
    counts. Confirm in game.
  detail: ""
- id: castorice-joint-atk-split
  entity: "1407"
  rule: C2
  status: open
  category: needs-data
  summary: >
    Boneclaw: the facts' Toughness (20 each) is put on Castorice's part, and
    Netherwing's part is tagged Skill, Joint ATK, and memosprite DMG. The
    per-part split and DMG types are not in the data.
  detail: ""
- id: hyacine-healing-tally
  entity: "1409"
  rule: U12
  status: open
  category: approximation
  summary: >
    The healing tally is computed from the heal formulas (Hyacine's panel Max
    HP plus her After Rain and A6 bonuses, Outgoing Healing from panel, A6 and
    the A2 toggle), counting overhealing, and kept in units of panel Max HP so
    Rainclouds scales with it. Little Ica heals only after enemy attacks and
    never runs out of HP; healing-received bonuses are ignored.
  detail: >
    Teammates' HP costs (Castorice, Blade) do not trigger Ica's healing or
    E2, and Fall, Then Take Wing never triggers. Overhealing counting toward
    the tally needs confirmation.
- id: evernight-evey-hp-loss
  entity: "1413"
  rule: U12
  status: open
  category: approximation
  summary: >
    Talent HP-loss triggers (CRIT DMG, +2 Memoria) come from enemy attacks
    on Evernight (her aggro share) and her own HP costs. Enemy attacks on
    Evey, who draws more aggro, are not modeled, so Memoria is underestimated.
  detail: "Needs memosprites as enemy targets with aggro (see engine-aggro-modifiers, engine-hp-model)."
- id: evernight-hp-cost-triggers
  entity: "1413"
  rule: U12
  status: open
  category: verify
  summary: >
    The Skill's 10% HP cost and A2's 5% HP cost are counted as one Talent
    HP-loss trigger per ability use. Whether each cost triggers separately
    (another +2 Memoria, +2 more with E2) needs confirmation.
  detail: ""

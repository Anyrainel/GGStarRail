- id: robin-summeretto-healing-vibes
  entity: "1512"
  rule: U12
  status: actionable
  category: engine-gap
  summary: >
    Vibes from teammates' healing (first per turn) and A4's Groove (fixed
    Energy after receiving healing) are not modeled, so Fever comes later and
    ends sooner with healers.
  detail: >
    Use `hpChanged` with hpCause "heal": +1 Vibes the first time in any
    unit's turn that an ally target provides healing (`limitPerTurn: 1`, the
    `source` is the healer, A2/E2 riders as for attacks); Groove (12 stacks,
    cap 12) when Robin • Summeretto or a Summer Songbird is healed by a
    teammate (`source` is not herself). Heals on allies at full HP emit no
    hpChanged and stay missed until engine-hp-event-triggers. Shields:
    robin-summeretto-shield-vibes.

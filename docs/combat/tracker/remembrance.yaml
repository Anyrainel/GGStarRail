  rule: U12
  status: open
  category: engine-gap
  summary: >
    Netherwing's HP is a kit counter (HP points of its fixed Max HP), not
    engine HP, so other kits do not see its Breath HP costs (Hyacine's Little
    Ica does not heal it) and its hpRatio stays 100%.
  detail: >
    Blocked on engine-hp-gain-not-heal. The game raises Netherwing's HP from

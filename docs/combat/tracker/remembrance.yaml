    received attack.
- id: evernight-hp-cost-triggers
  entity: "1413"
  rule: U12
  status: completed
  category: bug
  summary: >
    The Skill's 10% HP cost and A2's 5% HP cost are counted as one Talent
    HP-loss trigger per ability use; the game triggers the Talent on each HP
    decrease outside received attacks.
  detail: >
    The Skill calls ctx.consumeHp(self, hpRatio x #6) and A2 consumes hpRatio
    x A2 #2 at every Basic ATK, Skill, and Ultimate. The Talent (+2 Memoria,
    +2 more with E2, CRIT DMG for Evernight and Evey) now listens to hpChanged
    with hpCause consume or enemy for Evernight or Evey, so each cost triggers
    separately (two per Skill with A2) and enemy attacks trigger once per
    attack at their aggro weight. The Skill heals Evey by #4 of its Max HP
    when it is on the field, and E1/E4 reach memosprites through summoned.

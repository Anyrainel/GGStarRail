- id: cyrene-first-ultimate-cost
  entity: "1415"
  rule: U1
  status: open
  category: verify
  summary: >
    Facts give SPNeed 12 for both Ultimates. The first Ultimate is modeled as
    spending its 24-point activation threshold (Talent #4, Ultimate #2), so
    Reunion at First Sight does not follow it right away.
  detail: "If the first Ultimate really costs 12, change its resource amount to k.param(\"04\", 5)."
- id: cyrene-activate-ultimates
  entity: "1415"
  rule: C1
  status: open
  category: verify
  summary: >
    "Activates all teammates' Ultimate" is modeled as filling teammates'
    Energy. Ultimates paid with a kit resource (counters) are not filled.
  detail: ""
- id: cyrene-odes-unmodeled
  entity: "1415"
  rule: C1
  status: open
  category: engine-gap
  summary: >
    Odes that change another kit's own state are not modeled: Romance (DMG
    and DEF ignore until Supreme Stance ends), Strife, Life and Death,
    Worldbearing, Law, Earth, Passage's extra Additional DMG, Reason's extra
    Skill instances, Sky's healing tally, and Time's Dew DMG and Skill CRIT
    DMG parts. Ode to Time adds Memoria to Evernight's "memoria" counter by
    name.
  detail: "Modeled: Genesis, Trickery, Passage DEF ignore, Ocean, Romance Energy, Reason SP/advance/True Knowledge, Sky Energy, Time Memoria, non-Chrysos DMG buff. See engine-cross-kit-state."
- id: cyrene-ode-to-ego-sources
  entity: "1415"
  rule: C1
  status: open
  category: verify
  summary: >
    Ode to Ego counts teammates' memosprites as different teammates, since
    the text only excludes Demiurge. "Take action" with Future is modeled as
    turn start (extra turns included).
  detail: ""
- id: cyrene-ode-policy
  entity: "1415"
  rule: C3
  status: open
  category: approximation
  summary: >
    Demiurge gives "This Ode, to All Lives" once, on its first non-Story
    extra turn, to a heuristic damage dealer (a Chrysos Heir outside support

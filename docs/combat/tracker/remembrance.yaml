  detail: "See engine-ally-option-vocabulary."
- id: cyrene-genesis-panel
  entity: "1415"
  rule: U7
  status: open
  category: approximation
  summary: >
    Ode to Genesis reads Demiurge's steady panel: the Ultimate's CRIT Rate

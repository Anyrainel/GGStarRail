- id: castorice-max-newbud
  entity: "1407"
  rule: U1
  status: wont-do
  category: needs-data
  summary: >
    Max Newbud (and Netherwing's Max HP) is hard-coded to 34,000, the
    community value for level-80 teams (5.3125 x level^2). The text only says
    it depends on the Characters' levels; lower-level teams get less.
  detail: >
    Kit is right for normal accounts. Avatar_Castorice_00_Ability
    (Castorice_RefreshMaxSpecialSP): at Equilibrium Level 5 or higher the cap
    is 80^2 x 5.3125 = 34,000 regardless of team level; below 5 it uses the
    highest-level ally's level^2 x 5.3125 (minimum 2,000).
- id: castorice-hp-model
  entity: "1407"
  rule: U12
  status: completed
  category: approximation
  summary: >
    HP was not simulated. Newbud and Netherwing's HP come from assumed losses:
    allies (Characters only) at 80% HP when the Skills consume HP, 10% Max HP
    per enemy attack, and with A2 the sustain's healing restoring each loss
    (toggle healing-converted, capped per ally). Teammates' HP costs and heals,
    E4, and Mooncocoon's 1-HP floor are not seen.
  detail: >
    Castorice is on the HP model. Both Skills call ctx.consumeHp(ally, hpRatio
    x #1) for every ally target (memosprites included; Boneclaw skips
    Netherwing). The Talent sums hpChanged deltas with hpCause consume or
    enemy for every ally target except Netherwing (x the ally's panel Max HP)
    into Newbud, or into Netherwing's HP while it is present, and adds a DMG
    stack per loss (weighted); Netherwing's own Breath and Wings HP losses add
    the stack too (Passive02_OnListenHPChange is a halo on every ally,
    Netherwing included). A2 converts hpChanged heals of ally targets except
    Netherwing, capped per target at 12% of max Newbud and reset after any
    action; heals during Netherwing's departure go to its HP and are lost, as
    in the game. A4's SPD follows hpRatio >= 50%. Wings Sweep the Ruins heals
    all allies with ctx.heal. The 80%-HP and 10%-per-attack constants and the
    healing-converted and a4-hp-above toggles are gone. Still not modelled:
    Mooncocoon (the engine stops at 1% HP), memosprites' own Max HP
    (engine-memosprite-max-hp), E4 (castorice-e4-incoming-healing), and
    Netherwing's HP as engine HP (castorice-netherwing-hp-counter).
- id: castorice-netherwing-policy
  entity: "1407"
  rule: C3
  status: open
  category: verify
  summary: >
    Netherwing uses Breath while its HP stays above 25% (and with Ardent
    Will), Claw to end its first two turns, and on its third turn Breathes
    down to Wings Sweep the Ruins. Common play (some players dump all HP on
    the first turn) is unconfirmed.
  detail: >
    Settled: Wings triggers once per departure. The low-HP Breath's insert
    ability (Servant_CastoriceServant_PassiveInsertAbility_Phase02) removes
    the Deathrattle and BP_Explode modifiers before Wings, so it does not
    fire again on disappearing. Still open: which Breath/Claw pattern to
    simulate.

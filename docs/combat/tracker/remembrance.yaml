- id: hyacine-healing-tally
  entity: "1409"
  rule: U12
  status: actionable
  category: approximation
  summary: >
    The healing tally is computed from the heal formulas and Little Ica heals
    only after enemy attacks, never running out of HP; teammates' HP costs do
    not trigger Ica's healing or E2.
  detail: >
    Use the HP model. All heals (Skill, Ultimate, Ica, E1) call `ctx.heal`
    with the share from Hyacine's panel Max HP and Outgoing Healing. Ica:
    after any ally target's HP drops (`hpChanged`, delta < 0, any cause), at
    the next turn start or action end Ica consumes 4% of its own Max HP
    (`ctx.consumeHp`) and heals each ally whose HP was reduced: costs come from
    `hpChanged` (hpCause "consume"), enemy hits from `hitByEnemy` weighted by
    aggro (hpChanged "enemy" fires for every ally on every attack). E2: SPD
    status on the same two triggers (`stacks: ctx.weight` for enemy hits).
    A2's +25% applies when the target's
    hpRatio <= 50%. Tally: keep summing the requested heal amounts (overheal
    included) unless overheal is shown not to count; the config reads the
    heal through SetDynamicValueByHealDataProperty without naming the
    property, so this stays unconfirmed. Fall, Then Take Wing still cannot
    trigger (units never drop below 1% HP). Outgoing Healing from timed
    statuses waits on engine-momentary-stat-read.

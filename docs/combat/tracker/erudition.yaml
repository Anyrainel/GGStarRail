- id: qingque-a6-expected-spd
  entity: "1201"
  rule: U5
  status: wont-do
  category: approximation
  summary: >
    A6 SPD +10% after Enhanced Basic ATK is applied at the turn's expected
    Hidden Hand chance (fractional stacks) instead of only on the branch that
    used "Cherry on Top!", because the timeline cannot branch.
  detail: >
    This is the U9 construct: a chance-based buff on an ally is a status
    whose stacks equal the chance, and SPD statuses with fractional stacks
    move turn order in expectation. The timeline cannot branch, so nothing
    more exact exists.
- id: qingque-weighted-turn
  entity: "1201"
  rule: U9
  status: wont-do
  category: engine-gap
  summary: >
    The engine runs one ability per turn and ignores AbilityDef.endsTurn, and
    it cannot branch on random outcomes. Qingque's turn is a "celestialJade"
    pseudo-action (kind talent, no hits) that queues each outcome (Skills,
    Enhanced Basic ATK, Basic ATK) at its probability. Listeners with
    limitPerTurn count firings rather than probability mass, so a once-per-
    turn ally trigger (e.g. Kafka's follow-up after an ally Basic ATK) fires
    only on the first weighted branch and inherits its small weight.
  detail: >
    Made obsolete by engine-pass-wave1. Limits now count weight, so
    limitPerTurn is shared across the weighted branches and the last one is
    scaled to what remains, and endsTurn false exists. Queuing each random
    outcome with its probability is the U9 construct for outcomes that
    change the action, so the celestialJade pseudo-action stays.
- id: qingque-e4-report-merge
  entity: "1201"
  rule: C1
  status: wont-do
  category: engine-gap
  summary: >
    Hit groups ignore abilityId, so ctx.deal hits with the same tags and
    modifiers as the action's own hits (the E4 copy of Basic ATK) are merged
    into that ability's line of the damage report and never show as
    "e4:1201".
  detail: >
    Fixed by engine-pass-wave1: breakdown groups key on abilityId. The E4
    deal passes origin "e4", so it gets its own row, e4:1201.
- id: argenti-90-ultimate
  entity: "1302"
  rule: C1
  status: open
  category: engine-gap
  summary: >
    The engine only casts the ability named "ultimate". Argenti's 180-Energy
    Ultimate is that ability; the 90-Energy variant is defined as
    "ultimateLesser" but can never be chosen (e.g. near the end of a fight or
    when Energy cannot reach 180).
  detail: >
    Blocked on engine-policy-battle-end. The engine now casts Ultimate
    variants: an Ultimate policy can return "ultimateLesser", and its
    energyCost of 90 is honoured. What is missing is when to use it. Per
    Energy the 180-Energy version always deals more (kit comment), so the
    90-Energy version only pays when Argenti cannot reach 180 Energy before
    the battle ends. Once the policy can see the battle end, return
    "ultimateLesser" when Energy is 90 or more and the time left is too
    short to reach 180; otherwise wait for "ultimate".
- id: argenti-talent-timing
  entity: "1302"
  rule: C2
  status: actionable
  category: approximation
  summary: >
    Talent Energy and Apotheosis stacks are granted after each Basic ATK,
    Skill, or Ultimate resolves (one per distinct enemy hit), so stacks gained
    by the Ultimate's AoE part do not raise the CRIT Rate of its later bounce
    hits.
  detail: >
    Grant the Talent in afterHit instead of after. After each HitDef, call
    sublimeObject with the number of enemies that HitDef hit: index 0 of
    Basic ATK gives 1, index 0 of the Skill and of both Ultimates gives all
    enemies, and the 180-Energy Ultimate's bounce HitDef (index 1) gives
    nothing, because its targets were already counted. Text: "For every
    enemy hit ... grants him a stack of Apotheosis" (ZH
    每击中1个敌方目标...获得1层【升格】). The stacks from the AoE part then raise the CRIT
    Rate of the 6 bounce instances that follow. Energy totals do not change.

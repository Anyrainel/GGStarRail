- id: jing-yuan-lord-spd
  entity: "1204"
  rule: C5
  status: open
  category: engine-gap
  summary: >
    Summons keep a fixed engine SPD, so Lightning-Lord's +10 SPD per extra
    hit cannot be a status. The kit keeps it at base SPD and rescales its
    remaining action gauge with advanceAction (by old/new SPD) whenever its
    Hits Per Action change.
  detail: >
    The rescale needs the summon's remaining gauge, which the API does not
    expose. The kit tracks it from battle time recorded by its own turn,
    Ultimate, and Lightning-Lord policies (PolicyView has `time`, BattleApi
    does not) and keeps the summon handle returned by ctx.summon at
    battleStart (summons are not in ctx.allies). Test timelines match the
    hand-computed action values. Fix: let fixed-SPD summons read spdFlat from
    their statuses (memosprites already do); the kit would then apply a
    stacking SPD status to Lightning-Lord and drop the closure state.
- id: himeko-a4-burned-share
  entity: "1003"
  rule: U2
  status: open
  category: engine-gap
  summary: >
    A4 (Skill DMG +20% against Burned enemies) needs a target-status
    condition. The kit applies it as a self DMG Boost weighted by the Burned
    share of the Skill's multipliers, counting only Himeko's own Burn.
  detail: >
    Overestimates: the Burn status exists deterministically in the timeline
    while its 50% base chance is only applied at evaluation, and this boost
    ignores that chance. Burn from Fire Weakness Break is not counted. Needs a
    HitFilter condition on a target status family (Burn) that carries the
    debuff's landing chance.

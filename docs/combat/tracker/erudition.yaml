    remaining turns plus 2.
  detail: >
    Use the status lifecycle API from 61c14f6. For each enemy holding
    Serval's Shock, call ctx.extendStatus(enemy, shock, k.param("03", 2)).
    Drop the SHOCK_TURNS counter, its turnEnd listener, and the
    re-application, which emitted statusApplied. E4's new Shock on enemies
    that are not Shocked stays an applyStatus.

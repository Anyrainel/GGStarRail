# Combat translation tracker: erudition. Schema: .agents/skills/hsr-combat/tracking.md

- id: qingque-full-hand-draw
  entity: "1201"
  rule: U9
  status: open
  category: verify
  summary: >
    Drawing with a full hand (4 tiles) is modeled as adding the tile and then
    discarding one of the held suit with the fewest tiles, so four of a kind
    is kept and (3,1) hands converge to Hidden Hand. This rule sets Hidden
    Hand odds (about 80% at turn start after a tossed (3,1) hand plus four
    draws) and needs in-game confirmation.
  detail: >
    Not settled. The Talent only says she "can hold up to 4 tiles at one
    time" (ZH 最多持有4张琼玉牌), and fribbels (Qingque.ts) models no hand. Needs an
    in-game check: draw with a 3+1 hand and see which tile leaves.
- id: qingque-skill-hidden-hand
  entity: "1201"
  rule: C3
  status: wont-do
  category: verify
  summary: >
    Hidden Hand is entered as soon as Skill draws complete four tiles of one
    suit, so "Cherry on Top!" follows in the same turn, although the Talent
    text only names the turn start. Confirm that the Skill path enters Hidden
    Hand immediately.
  detail: >
    The kit is right. The Talent says that in Hidden Hand "Qingque cannot
    use her Skill again" (ZH 无法再次施放战技), which assumes Hidden Hand can start
    after a Skill in the same turn. fribbels' default rotation (Qingque.ts
    comboTurnAbilities START_SKILL, END_BASIC with basicEnhanced on) also
    plays Skill and then "Cherry on Top!" in one turn.

- id: anaxa-weakness-duration
  entity: "1405"
  rule: U5
  status: open
  category: engine-gap
  summary: >
    Talent Weakness implants last 3 turns and "Sublimation" Weaknesses last
    until the enemy's turn starts, but the API can only add Weaknesses
    (implantWeakness), never remove them. Implanted Weaknesses persist, so
    "Qualitative Disclosure" never lapses once reached and A2's "no enemy in
    Qualitative Disclosure" Energy stops after the first Ultimate.
  detail: >
    Needs a timed implant (duration, countdown) or a removeWeakness call.
    The implanted Type is the first missing one in a fixed order instead of
    a random missing Type.

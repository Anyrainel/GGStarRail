- id: jing-yuan-lord-spd
  entity: "1204"
  rule: C5
  status: actionable
  category: engine-gap
  summary: >
    Summons keep a fixed engine SPD, so Lightning-Lord's +10 SPD per extra
    hit cannot be a status. The kit keeps it at base SPD and rescales its
    remaining action gauge with advanceAction (by old/new SPD) whenever its
    Hits Per Action change.
  detail: >
    Since engine-pass-wave1, summons read SPD statuses. Declare a stacking
    status with spdFlat k.param("04", 3) per stack and maxStacks maxHits -
    baseHits. Keep its stacks equal to hits - baseHits with
    ctx.setStatusStacks on Lightning-Lord whenever HITS changes (Skill,
    Ultimate) and when it resets after the Lord's attack. Find the summon
    with ctx.findSummon(ctx.self, lightningLord.id) instead of the closure
    handle. Then drop the closure state (now, gauge, gaugeAt, lord) and the
    advanceAction rescale, because turn order keeps the remaining distance
    when SPD changes.
- id: himeko-a4-burned-share
  entity: "1003"
  rule: U2
  status: actionable
  category: engine-gap
  summary: >
    A4 (Skill DMG +20% against Burned enemies) needs a target-status
    condition. The kit applies it as a self DMG Boost weighted by the Burned
    share of the Skill's multipliers, counting only Himeko's own Burn.
  detail: >
    Replace the magma share status with k.stat("a4", { stat: "dmgBoost",
    value: k.traceParam(2, 1), filter: { tags: ["skill"], targetFamilies:
    ["burn"] } }) when A4 is unlocked, and drop the before/after sync.
    targetFamilies checks each target and sees every Burn: Break Burn, Ashen
    Roast, and other kits' Burns. The filter still ignores the Burn's
    landing chance; engine-debuff-landing-chance tracks that.

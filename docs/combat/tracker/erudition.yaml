- id: serval-shock-sources
  entity: "1103"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    "Shocked" (Talent Additional DMG, E6) should include Shock from other
    Characters (Kafka) and from Lightning Weakness Break; kits can only test
    their own status definitions, so only Serval's Shock counts.
  detail: >
    Effects gated on the Shock's presence also ignore its landing chance:
    ctx.deal has no chance, so the Talent's Additional DMG is dealt in full
    while the Shock DoT itself is weighted by the chance. Needs status
    families on enemies and a chance-carrying deal or condition.
- id: serval-e6-shocked-share
  entity: "1103"
  rule: U2
  status: open
  category: approximation

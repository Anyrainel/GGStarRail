    E6 (DMG +30% against Shocked enemies) is a self DMG Boost weighted by the
    Shocked share of each attack's multipliers, plus an unconditional DoT DMG
    Boost (her Shock DoT only hits Shocked enemies).
  detail: >
    The total is exact when the targets share their other modifiers, but the
    bonus is spread over every target of the attack. A target-status HitFilter
    would make it exact.
- id: serval-shock-extend
  entity: "1103"
  rule: U5
  status: open
  category: engine-gap
  summary: >
    The Ultimate extends remaining Shock duration by 2 turns, but the API
    cannot read or extend a status's remaining turns. The kit mirrors Shock
    turns in a per-enemy counter and re-applies Shock with `turns` set to the
    remaining turns plus 2.
  detail: >
    Re-applying emits statusApplied, so other kits' "when a debuff is
    applied" listeners see the extension as a new application.

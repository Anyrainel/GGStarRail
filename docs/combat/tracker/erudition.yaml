- id: jade-bounce-hit-count
  entity: "1314"
  rule: U9
  status: open
  category: approximation
  summary: >
    Charge and Debt Collector Additional DMG count every enemy with a nonzero
    expected hit, so a Bounce attack counts each enemy once even when fewer
    bounces than enemies would leave some unhit.
  detail: >
    No exact construct. A Bounce placement reaches the hit listener as one
    event per enemy with weight bounces / enemies, and the listener cannot
    tell it from an AoE placement. So it cannot compute the chance that an
    enemy is hit at least once, 1 - (1 - 1/n)^bounces. Exact handling needs
    the hit event to carry its shape and bounce count, or actionEnd
    targetsHit to carry a per-enemy hit chance. Only Bounce attacks by Jade
    or a Debt Collector are affected.
- id: rappa-ignore-weakness
  entity: "1317"
  rule: U2
  status: actionable
  category: engine-gap
  summary: >
    Enhanced Basic ATK reduces Toughness of enemies without Imaginary Weakness
    at 50%, and the Talent's Break DMG reduces Toughness regardless of
    Weakness, both breaking with the Imaginary effect. The engine only reduces
    Toughness of enemies weak to the hit's Combat Type, so these reductions
    (and the Super Break from A4 on such enemies) are missing.
  detail: >
    Use toughnessWithoutWeakness (engine-pass-wave1). The three Enhanced
    Basic ATK HitDefs take toughnessWithoutWeakness: k.param("18", 4), which
    is 50% ("Attacking enemies that don't have Imaginary Weakness can also
    reduce Toughness ... equal to 50% of the original"). The Talent's Break
    DMG hit takes toughnessWithoutWeakness: 1 ("This DMG can ignore Weakness
    Type to reduce 2 Toughness"). Both break with Rappa's own Imaginary
    type, which the engine already uses. A4's Super Break on Broken enemies
    without the Weakness then follows from the reduced Toughness.

- id: anaxa-skill-bounce-toughness
  entity: "1405"
  rule: U1
  status: actionable
  category: bug
  summary: >
    fribbels gives the Skill 10 Toughness for the designated hit and 5 for
    each of the 4 extra instances (30 in total on one target); our kit gives
    every instance 10 (50 in total). Which matches the game?
  detail: >
    Settled by fribbels (Anaxa.ts skillToughness = 10 + addedSkillHits * 5):

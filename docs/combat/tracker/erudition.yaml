- id: rin-tohsaka-facts
  entity: "1508"
  rule: U1
  status: actionable
  category: bug
  summary: >
    The pinned TurnBasedGameData revision has no facts for Rin Tohsaka
    (1508xx). Assumed: Basic ATK 10 Toughness, Skill 20, "Second Magic
    Experiment" 10 per enemy on its AoE part and none per random instance,
    Ultimate 20 on every target, Joint Follow-Up ATK 10 per enemy (Rin's
    part only) with 10 Energy; default Energy/Skill Points otherwise.
  detail: >
    The pinned facts now include 1508xx, so apply them. Basic ATK 10
    (150801) and Skill 20 (150802) match the assumptions. The Ultimate
    (150803) is 30 on the designated target and 20 on the others, where the
    kit gives 20 to all; use one AoE HitDef with main and each instead of
    blast plus a deal. The Joint Follow-Up ATK (150805) is 20 per enemy with
    10 Energy, where the kit has 10 Toughness. Second Magic Experiment
    (150809) is 20 per enemy on its AoE part and 2 per random instance (kit:
    10 and 0), with 30 Energy and SP-cost 0: set skillPoints: 0, since only
    the conversion down to 2 consumes Skill Points, and drop its skillPoints
    >= 1 check from the turn policy. fribbels (RinTohsaka.ts) uses the same
    values: 20 plus 2 per bounce, Ultimate 30, Follow-Up 20. The 10 Energy
    in the 150804 Talent facts belongs to no action; ignore it.
- id: rin-tohsaka-sp-cap
  entity: "1508"
  rule: U10
  status: actionable
  category: engine-gap
  summary: >
    A2 raises the Skill Point cap by 2 while Rin is on the field, but the cap
    is a fixed battle option (5) that kits cannot change. The Talent's "7 or
    more Skill Points" route to "Second Magic Experiment" is therefore never
    reachable, and surplus Skill Points above 5 are lost.
  detail: >
    With A2, call ctx.setMaxSkillPoints(ctx.maxSkillPoints + k.traceParam(1,
    1)) at battleStart ("While Rin Tohsaka is on the field, additionally
    increases the upper limit of Skill Points by 2"). This makes the
    Talent's 7-or-more Skill Points route reachable. Remove the "not
    modeled" comment. Archer's A2 needs the same change in its own tracker.
- id: rin-tohsaka-sp-events
  entity: "1508"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    There is no event for Skill Point consumption or recovery. The Talent
    compares the Skill Point count at every action and turn boundary and
    credits the change to the unit acting there, so changes made by later
    listeners can be credited to the next actor, opposite changes within one
    window cancel out, and recovery lost at the cap does not count.
  detail: >
    Replace the SEEN_SKILL_POINTS polling (four listeners plus the manual
    sync in enhancedSkill) with k.on("skillPointsChanged", "talent", {
    subject: "any" }, ...). The handler gains |event.delta| Gem Energy and
    gives the CRIT DMG buff to event.unit (its owner for summons;
    selfCritDmg when it is Rin). delta is measured after the cap, so
    recovery lost at the cap does not count.
- id: rin-tohsaka-conversion-talent
  entity: "1508"
  rule: U8
  status: wont-do
  category: verify
  summary: >
    Skill Points consumed by "Second Magic Experiment" (down to 2) are read as
    also triggering the Talent: each grants 2 Gem Energy from the Skill plus 1
    from the Talent, and the Talent's CRIT DMG boost. Confirm whether the
    conversion counts as consuming Skill Points for the Talent.
  detail: >
    The kit is right. The Skill "consumes Skill Points down to 2" (ZH
    将战技点消耗至2点) with the same verb as the Talent's "When an ally target
    consumes or recovers Skill Points" (ZH 我方目标消耗或恢复战技点时). With
    skillPointsChanged (rin-tohsaka-sp-events), the conversion reaches the
    Talent without the manual sync.
- id: rin-tohsaka-circuit-count

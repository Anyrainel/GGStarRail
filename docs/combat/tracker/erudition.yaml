- id: rin-tohsaka-sp-cap
  entity: "1508"
  rule: U10
  status: open
  category: engine-gap
  summary: >
    A2 raises the Skill Point cap by 2 while Rin is on the field, but the cap
    is a fixed battle option (5) that kits cannot change. The Talent's "7 or
    more Skill Points" route to "Second Magic Experiment" is therefore never
    reachable, and surplus Skill Points above 5 are lost.
  detail: "Archer's A2 needs the same capability."
- id: rin-tohsaka-sp-events
  entity: "1508"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    There is no event for Skill Point consumption or recovery. The Talent
    compares the Skill Point count at every action and turn boundary and
    credits the change to the unit acting there, so changes made by later
    listeners can be credited to the next actor, opposite changes within one
    window cancel out, and recovery lost at the cap does not count.
  detail: "Needs a skillPointsChanged event carrying the unit and the signed amount."

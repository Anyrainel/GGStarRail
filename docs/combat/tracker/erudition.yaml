- id: serval-shock-extend
  entity: "1103"
  rule: U5
  status: actionable
  category: engine-gap
  summary: >
    The Ultimate extends remaining Shock duration by 2 turns, but the API
    cannot read or extend a status's remaining turns. The kit mirrors Shock

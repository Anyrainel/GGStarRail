- id: anaxa-weakness-duration
  entity: "1405"
  rule: U5
  status: actionable
  category: engine-gap
  summary: >
    Talent Weakness implants last 3 turns and "Sublimation" Weaknesses last
    until the enemy's turn starts, but the API can only add Weaknesses
    (implantWeakness), never remove them. Implanted Weaknesses persist, so
    "Qualitative Disclosure" never lapses once reached and A2's "no enemy in
    Qualitative Disclosure" Energy stops after the first Ultimate.
  detail: >
    Use timed implants and removeWeakness (engine-pass-wave1). Talent and E2
    implants: ctx.implantWeakness(enemy, type, { turns: k.param("04", 2) })
    (3 turns; a re-implant refreshes the timer). When no Type is missing,
    the Talent still picks a random held Type, so refresh one with the same
    turns. Sublimation: implant the missing Types and record per enemy which
    Types only Sublimation added. On statusRemoved with status: sublimation
    (it expires at the enemy's turn start), call removeWeakness for those
    Types unless a Talent implant has refreshed them since. Re-evaluate
    Qualitative Disclosure in both directions (apply at 5 or more Types,
    remove below) in the hit listener, at Anaxa's actionStart, and at her
    turnStart before A2's Energy check.
- id: anaxa-disclosure-dmg
  entity: "1405"
  rule: U3
  status: actionable
  category: engine-gap
  summary: >
    "Anaxa deals 30% increased DMG to targets afflicted with Qualitative
    Disclosure" needs an outgoing modifier conditioned on a status held by
    the hit target. The kit holds a DMG Boost status on Anaxa synced to her
    action's main target (re-checked after each hit on it); Bounce and AoE
    targets are assumed to share the main target's state.
  detail: >
    Replace disclosureDmg and the actionTarget sync with k.stat("talent", {
    stat: "dmgBoost", value: k.param("04", 1), filter: { targetStatuses:
    [disclosure.id] } }). Every Bounce and AoE hit then reads its own
    target's state.

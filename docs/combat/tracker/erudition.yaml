- id: himeko-fua-hit-split
  entity: "1003"
  rule: C2
  status: actionable
  category: bug
  summary: >
    fribbels splits the Talent Follow-Up ATK into 4 damage instances
    (20/20/20/40% of the 140% multiplier); our kit deals it as one AoE
    instance. Which instance count matches the game?
  detail: >
    Settled by fribbels (Himeko.ts hitMultiByTargets): the Follow-Up ATK is
    4 instances weighted 20/20/20/40%. The text and facts give only totals,
    and fribbels' Ashblazing splits are per-instance ratios from the game
    data. Deal the Follow-Up ATK as 4 AoE HitDefs of 0.2, 0.2, 0.2, and 0.4
    x k.param("04", 1), with the 10 Toughness per enemy split the same way
    (2/2/2/4). That split is an assumption: Toughness follows each
    instance's DMG ratio, as for Luka's punches. Burn stays once per attack
    (A2: "After using an attack").
- id: jade-fua-hit-split
  entity: "1314"
  rule: C2
  status: actionable
  category: bug
  summary: >
    fribbels splits the Talent Follow-Up ATK into 4 equal instances, and the
    Ultimate-enhanced one into 5 (10/10/10/10/60%); our kit deals both as one
    AoE instance (the enhancement is a multiplierBoost). Which instance
    counts match the game?
  detail: >
    Settled by fribbels (Jade.ts): the Talent Follow-Up ATK is 4 equal
    instances, and the Ultimate-enhanced one is 5 instances weighted
    10/10/10/10/60% of the enhanced total. Make hits a function. Without
    Vow: 4 AoE HitDefs of 0.25 x k.param("04", 5). With Vow: 5 HitDefs of
    0.1, 0.1, 0.1, 0.1, and 0.6 x (k.param("04", 5) + k.param("03", 1)),
    which removes the need for the multiplierBoost status. Split the 10
    Toughness per enemy in the same ratios (assumed to follow the DMG
    ratio). Charge and the Debt Collector logic count enemies, not
    instances, so they do not change.
- id: the-herta-interpretation-per-hit
  entity: "1401"
  rule: U2
  status: open
  category: verify
  summary: >
    fribbels adds the Interpretation bonus (8% per stack, doubled with 2 or

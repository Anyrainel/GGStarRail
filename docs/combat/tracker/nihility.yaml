- id: black-swan-dot-types
  entity: "1307"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    Wind Shear, Bleed, Burn, and Shock are recognized by the Combat Type of DoT
    statuses learned from statusApplied events, since kits cannot list a unit's
    statuses or ask a status's family.
  detail: >
    Use families (e6be6bc tagged every Character DoT). afflictions(enemy)
    reads enemy.hasFamily for windShear, bleed, burn, and shock, mapped to
    Wind, Physical, Fire, and Lightning for E1. The dotTick check reads
    event.status.family and excludes frozen and entanglement, whose ticks
    are Additional DMG. Drop the dotTypes map and its statusApplied learner.
    For "Arcana under Epiphany counts as Wind Shear, Bleed, Burn, and
    Shock", declare four marker statuses, one per family, with no modifiers,
    no DoT, and not debuffs (so debuff counts do not change). Apply them to
    an enemy when it holds both Epiphany and Arcana: in the Ultimate's
    before after Epiphany, and in inflictArcana when the target has
    Epiphany. Remove them on statusRemoved with status: epiphany, and if
    Arcana is ever removed. Other kits' Burned/Shocked checks (Guinaifen,
    Himeko A4, Prisoner in Deep Confinement, Serval) and E1 then see the
    Epiphany types through hasFamily and targetFamilies.
- id: black-swan-tick-source
  entity: "1307"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    dotTick does not say whether it is a turn-start tick or a detonation, so the
    kit treats ticks during an enemy's own turn as turn-start DoT (Talent, ≥7
    DEF ignore, reset) and others as in-attack DoT (A4).
  detail: >
    dotTick now carries detonation (engine-pass-wave1). Treat
    !event.detonation as the turn-start DoT (Talent stack, DEF ignore at 7
    or more stacks, reset), and treat detonations during an ally attack as
    A4's "DoT during a single attack". Drop OWN_TURN from the dotTick
    classification, and keep it only if Epiphany's "in their turn"
    vulnerability still needs it.

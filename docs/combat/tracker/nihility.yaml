  category: verify
  summary: >
    E1 "Dance Partners additionally receiving a 40% boost" is read as +40
    percentage points on the Talent's 60% Super Break multiplier (100% total),
    not 60% x 1.4.
  detail: >
    The kit is right. ZH 其中【共舞者】的倍率额外提高40% raises the multiplier by 40
    points, as in U2's "increases the DMG multiplier by X%". fribbels
    (TheDahlia.ts) also adds 0.40 to the Super Break modifier for Dance
    Partners.
- id: cipher-tally
  entity: "1406"
  rule: U2
  status: open
  category: engine-gap
  summary: >
    The tally released by the Ultimate is modeled as True DMG (trueDmg) on
    every ally hit when dealt, credited to the attacker instead of Cipher;
    non-Patron enemies use the Patron rate (A4 tallies them lower, nothing
    without A4), and E6's 20% return is folded in as 1/(1 - 20%).
  detail: >
    Blocked on engine-damage-tally. Once evaluated hit DMG can be tallied on
    a unit: tally 12% of allies' non-True DMG to the Patron and, with A4, 8%
    to other enemies, scaled by E1 and A2. Release it as True DMG in
    Cipher's Ultimate (25% to the target, 75% split over the Blast targets),
    with E6's 20% return. Until then, the per-target rates can already use
    targetStatuses: [patron.id]: put the A4 rate on every hit and the
    difference on Patron hits only (without A4, only the Patron rate on
    Patron hits).
- id: hysilens-zone-trigger-cap
  entity: "1410"
  rule: U8
  status: open
  category: verify
  summary: >
    The Zone's Physical DoT fires once per DoT instance an enemy takes, capped
    at 8 (E6: 12) per enemy per window (its turn start, or one ally attack);
    whether the per-attack cap is per enemy or shared by all enemies is unclear.
  detail: >
    Not settled. ZH
    处于结界中的敌方目标每受到1次持续伤害，海瑟音对其造成...该伤害在每回合开始时或我方目标单次攻击后触发，且最多触发8次 makes the
    enemy the subject, which leans toward a cap per enemy, but does not say
    so. fribbels evaluates one target (ultDotStacks up to 8, or 12 at E6).
    The ignored landing chance of the triggering DoT is tracked by
    engine-debuff-landing-chance.
- id: hysilens-state-priority
  entity: "1410"
  rule: U9
  status: open
  category: approximation
  summary: >
    Talent states go to the first of Wind Shear, Bleed, Burn, and Shock the
    enemy lacks from Hysilens; once it has all four they are refreshed in
    rotation. Bleed always deals its ATK cap (enemy Max HP is not modeled).
  detail: >
    Not exact, but the impact is low. All four states deal 25% of ATK at the
    Bleed cap, so Hysilens' own damage does not depend on the order. Random
    states with priority to a missing one cannot be expressed in expectation
    with binary presence, so other kits' family checks see the fixed order.
    The Bleed cap needs enemy Max HP; engine-kill-triggers covers enemy HP.
- id: hysilens-field-effects
  entity: "1410"
  rule: U3
  status: open
  category: verify
  summary: >
    Zone DEF/RES reductions are enemy statuses that are not debuffs (field
    effects), so per-debuff effects do not count them.
  detail: >
    This item carries the question of whether Zone effects count as debuffs,
    for Hysilens, Jiaoqiu (jiaoqiu-zone-modeling), Cipher's A6, The Dahlia's
    E2, and Mortenax Blade's E1. Not settled: none of the texts call these
    effects debuffs. fribbels models Hysilens' Zone DEF reduction as
    attacker-side DEF PEN for the team (the same DEF zone), which does not
    say whether per-debuff effects count it. Needs an in-game check, such as
    Acheron's Slashed Dream or Pioneer Diver stacks when the Zone deploys.
- id: mortenax-blade-overflow-energy
  entity: "1507"
  rule: U10
  status: open
  category: engine-gap
  summary: >
    A2 overflow Energy (up to 80, refunded after the Ultimate) is tracked only

    cycles.
  detail: >
    Not settled by the text: this is a play-pattern choice between casting
    Fornax as soon as Energy is full and holding it to bank A2 overflow.
    Needs a human decision; engine-policy-battle-end would let the hold
    depend on the time left.
- id: mortenax-blade-e2-ult-follow-up
  entity: "1507"
  rule: U4
  status: open
  category: engine-gap
  summary: >
    E2 "Ultimate DMG is considered Follow-Up ATK" only gives allies' Ultimate DMG

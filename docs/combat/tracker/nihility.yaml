- id: silver-wolf-implant
  entity: "1006"
  rule: U11
  status: actionable
  category: engine-gap
  summary: >
    The implanted Weakness is permanent and always lands (the Engine cannot
    remove a Weakness or gate it by base chance); its Type is the first ally
    Type, in team order, that the enemy is not natively weak to.
  detail: >
    Use timed implants and removeWeakness (engine-pass-wave1). Implant with
    { turns: implantTurns } (Skill #3 plus A4), so the Weakness lasts as

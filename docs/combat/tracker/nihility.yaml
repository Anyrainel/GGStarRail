    triggers do not see those Ultimates.
  detail: >
    Blocked on engine-ally-tag-rewrite. Once a kit can add tags to allies'
    abilities, E2 adds followUp to allies' Ultimate actions and hits, so
    Follow-Up effects and "after a Follow-Up ATK" triggers see them, and the
    teamStat filter reads only the followUp tag.
- id: mortenax-blade-a4-aggro
  entity: "1507"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    A4's higher chance of being attacked in the Zone is not modeled, which

# Combat translation tracker: nihility. Schema: .agents/skills/hsr-combat/tracking.md
- id: jiaoqiu-e1-target-filter
  entity: "1218"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    E1 "Allies deal 40% more DMG to enemies with Ashen Roast" needs an outgoing
    DMG Boost filtered by target state; the kit toggles a status on each
    attacking ally from its main target at actionStart, so Blast/AoE secondary
    targets and later DoT ticks use the attacker's last state.
  detail: >
    E1 is k.teamStat("e1", dmgBoost k.rankParam(1, 1), filter {
    targetStatuses: [ashenRoast.id] }) for all allies; the actionStart sync
    and its self status are gone, so Blast and AoE targets and DoT ticks use
    their own target's Ashen Roast.
- id: jiaoqiu-zone-modeling
  entity: "1218"
  rule: U3
  status: wont-do
  category: verify
  summary: >
    The Zone's Ultimate DMG taken is a non-debuff field status on enemies, the
    Ultimate's stack sync is guaranteed (no base chance), and the Zone stack
    trigger fires on the enemy's attack (after DoTs, skipped while Frozen).
  detail: >
    Settled where the text decides. The Ultimate "Sets the number of Ashen
    Roast stacks" (ZH 统一设置) with no base chance, so the sync is guaranteed.
    The Zone's stack is gained "when taking action" (ZH 行动时), which a Frozen
    enemy skips, so the enemyAttack trigger fits. Whether a Zone's effects
    on enemies count as debuffs is the same question as
    hysilens-field-effects, which carries it.
- id: jiaoqiu-burn-family
  entity: "1218"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    Ashen Roast "is also considered Burned", but the engine has no shared DoT
    family, so other kits' Burn checks cannot see it.
  detail: >
    Ashen Roast's Burn status declares `family: "burn"`. The same pass added
    families to the DoTs, Slows, and Imprisonment of Dan Heng, Himeko, Welt,
    Kafka, Serval, Sampo, Hook, Luka, Guinaifen, and Hysilens. Misha's and
    Yanqing's Freezes, and Black Swan's Arcana under Epiphany, still need
    kit changes.
- id: jiaoqiu-a6-reinforcements
  entity: "1218"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    A6 (enemies entering combat while the Zone exists gain Ashen Roast) and the
    E6 stack transfer on defeat are not modeled: scenarios have no
    reinforcements or kills.
  detail: >
    Blocked on engine-kill-triggers: scenarios have no kills or
    reinforcements. Once enemies can enter mid-battle or be defeated, A6
    inflicts Ashen Roast on entering enemies at the highest stack count held
    during the Zone (minimum 1), and E6 moves a defeated enemy's stacks to
    the enemy with the fewest.

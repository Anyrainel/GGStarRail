- id: acheron-slashed-dream-energy
  entity: "1308"
  rule: U10
  status: completed
  category: engine-gap
  summary: >
    Slashed Dream is mirrored into Energy from a kit counter and resynced on
    hitByEnemy and every ally actionEnd, because the engine always grants enemy
    hit Energy and ally Energy effects; Energy granted in another listener after
    that resync lingers until the next one.
  detail: >
    The Ultimate declares resource: { counter: DREAM, amount: k.param("04",
    1) }; the engine spends the counter. setEnergy, resync, and the
    hitByEnemy and actionEnd resync listeners are gone, so Energy from enemy
    hits and allies no longer matters.

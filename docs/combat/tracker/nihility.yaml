  detail: >
    Blocked on engine-aggro-modifiers. Once a status can raise aggro, A4's
    Zone raises Mortenax Blade's chance of being attacked, which feeds A4/E6
    Charge and Energy from enemy hits.
- id: guinaifen-a6-target-filter
  entity: "1210"
  rule: U2
  status: actionable
  category: engine-gap
  summary: >

  detail: >
    Blocked on engine-enemy-effect-res. Once it is supported, E1's Skill
    applies an enemy status with effectRes -k.rankParam(1, 2), with its base
    chance.
- id: guinaifen-burn-family
  entity: "1210"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    "Burn" (Firekiss, Ultimate detonation, E2, A6) is any Fire DoT status seen
    through statusApplied; another kit's Burn without an explicit Fire
    combatType on its DoT hit is not recognized.
  detail: >
    Families exist since e6be6bc. Use enemy.hasFamily("burn") for "Burned"
    (E2's boosted Burn, Firekiss, and A6 through
    guinaifen-a6-target-filter), and status.family === "burn" for the
    Ultimate's detonation filter and the Firekiss dotTick check. Drop
    knownBurns and the statusApplied learner. Ashen Roast, Break Burn, and
    the Burns of Himeko, Hook, Asta, and Hysilens then count. Luka (1111)
    recognizes Bleed the same way (knownBleeds); switch it to
    hasFamily("bleed") and family === "bleed" in the same change.

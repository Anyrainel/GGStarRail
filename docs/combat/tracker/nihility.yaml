- id: sampo-bounce-stacks
  entity: "1108"
  rule: U6
  status: open
  category: engine-gap
  summary: >
    applyStatus ignores event weight, so the kit passes the Bounce placement's
    expected hit count as Wind Shear stacks; and base-chance stacking DoTs scale
    the capped stack count by the landing chance, underestimating saturation.
  detail: >
    The weight part is the documented construct (Weights: applyStatus stacks
    are not scaled, so pass the expected count). What remains: a base-chance
    stacking DoT scales min(cap, applied stacks) by its landing chance
    instead of E[min(cap, landed stacks)]. Blocked on
    engine-debuff-landing-chance; then apply one stack per hit with its base
    chance and let the engine combine them. The error vanishes as the
    landing chance nears 100%.

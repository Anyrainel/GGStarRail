- id: fugue-def-timing
  entity: "1225"
  rule: U8
  status: open
  category: bug
  summary: >
    Foxian Prayer's DEF reduction is applied to the main target when the
    holder's attack starts and to other enemies after their first hit; confirm
    whether it lands before the attack's damage on every target.
  detail: >
    Settled reading, kit partly wrong: ZH
    持有【狐祈】的我方目标每次施放攻击时...使受到攻击的敌方目标防御力降低 uses 施放攻击时 ("when using an attack",
    not 攻击后 "after attacking"), so the DEF reduction lands before the
    attack's damage on every attacked enemy. The kit debuffs the secondary
    targets only after their first hit. Blocked on engine-action-targets:
    once actionStart says which enemies the action will hit, apply the
    debuff to all of them there.
- id: welt-slow-family
  entity: "1004"
  rule: U8
  status: actionable

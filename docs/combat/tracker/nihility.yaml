- id: acheron-slashed-dream-energy
  entity: "1308"
  rule: U10
  status: actionable
  category: engine-gap
  summary: >
    Slashed Dream is mirrored into Energy from a kit counter and resynced on
    hitByEnemy and every ally actionEnd, because the engine always grants enemy
    hit Energy and ally Energy effects; Energy granted in another listener after
    that resync lingers until the next one.
  detail: >
    Use a custom Ultimate resource (engine-pass-wave1): declare the Ultimate
    with resource: { counter: DREAM, amount: k.param("04", 1) } (9), then
    drop setEnergy, resync, and the hitByEnemy and actionEnd resync
    listeners. Energy from enemy hits and ally effects then stops mattering.
- id: acheron-talent-window
  entity: "1308"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    "Inflicts debuffs while using their ability" is a window opened at each ally
    actionStart and closed at enemy turnStart; debuffs applied by an earlier-slot
    kit's actionStart listener are missed, and base-chance debuffs always count
    as landed.
  detail: >
    Blocked on engine-status-applied-action. Once statusApplied says which
    ability use it belongs to, gain Slashed Dream and a Knot on the first
    debuff of each ability use by any unit, with no window counters, and
    ignore applications outside ability use, such as DoT-time Arcana. The
    landing-chance part (base-chance debuffs always count) is
    engine-debuff-landing-chance.

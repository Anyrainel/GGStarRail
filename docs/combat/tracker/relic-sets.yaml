- id: warrior-goddess-heal-trigger
  entity: "125"
  rule: U12
  status: actionable
  category: engine-gap
  summary: >
    Healing is not simulated, so Gentle Rain (wearer SPD, all allies' CRIT
    DMG) is an on-by-default "active" option held for the whole battle
    instead of a 2-turn state gained when the wearer or its memosprite heals
    another ally (once per turn).
  detail: >
    Convention (HP): allies' HP is simulated (e553888), so U12 models HP
    costs, heals, and thresholds with consumeHp/heal/setHp, hpRatio, and
    hpChanged, and an own-HP option is a [BUG]. Enemy hits stay on
    hitByEnemy (weight = aggro share), because hpChanged with hpCause
    enemy fires for every ally on every enemy attack. Remove the
    gentle-rain option and the permanent stats. Gain Gentle Rain (#3
    turns, limitPerTurn 1) on hpChanged with hpCause heal, source the
    wearer or its memosprite, and a healed unit other than the source;
    while it is held, the wearer's SPD +#1 and all allies' CRIT DMG +#2
    (statuses on the wearer's clock, unique across wearers). Heals on
    full-HP allies emit no event (engine-hp-event-triggers). Needs the
    healer kits to call ctx.heal.

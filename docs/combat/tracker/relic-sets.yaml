# Combat translation tracker: relic-sets. Schema: .agents/skills/hsr-combat/tracking.md
- id: fleet-of-the-ageless-aura-dedupe
  entity: "302"
  rule: U13
  status: wont-do
  category: engine-gap
  summary: >
    Equipment team auras from several wearers are deduplicated in
    assembleTeam by stat and filter only, keeping the highest `value`. Fleet
    of the Ageless and Broken Keel auras are threshold-scaled (value 0), so
    the first wearer's copy is kept even when only another wearer meets the
    SPD / Effect RES threshold; Penacony auras restricted to different
    Combat Types (312) collapse into one, dropping the second wearer's.
  detail: >
    Fixed in engine 61c14f6: equipment team auras compare scaled values,
    and auras limited to different Combat Types or Paths are no longer
    merged.
- id: hunter-of-glacial-forest-ultimate-timing
  entity: "104"
  rule: U8
  status: actionable
  category: bug
  summary: >
    Hunter of Glacial Forest's 4-piece CRIT DMG is applied when the Ultimate
    ends (EN "After the wearer uses their Ultimate"), so it does not boost
    the triggering Ultimate. The ZH text reads "when" (施放终结技时), which
    would include it.
  detail: >
    Settled: the source-language text reads 'when the wearer uses their
    Ultimate' (当装备者施放终结技时), and fribbels applies the 25% CRIT DMG to all
    of the wearer's damage, the Ultimate included (default on). Switch the
    listener to actionStart so the triggering Ultimate is boosted.
- id: guard-of-wuthering-snow-own-hp
  entity: "106"
  rule: U12
  status: actionable
  category: bug
  summary: >
    Guard of Wuthering Snow's 4-piece turn-start Energy needs the wearer at
    or below 50% HP. HP is not simulated, so it is one off-by-default toggle
    (selfHpBelow) that applies to every turn start of the battle.
  detail: >
    Convention (HP): allies' HP is simulated (e553888), so U12 models HP
    costs, heals, and thresholds with consumeHp/heal/setHp, hpRatio, and
    hpChanged, and an own-HP option is a [BUG]. Enemy hits stay on
    hitByEnemy (weight = aggro share), because hpChanged with hpCause
    enemy fires for every ally on every enemy attack. Remove the low-hp
    toggle. At the wearer's turn start, if self.hpRatio ≤ #1,
    ctx.heal(self, #2) and regenerate #3 Energy.
- id: longevous-disciple-hp-consumed
  entity: "113"
  rule: U12
  status: actionable
  category: approximation
  summary: >
    Longevous Disciple's 4-piece stacks on HP consumption are assumed at the
    start of the wearer's HP-costing ability kinds (Blade, Arlan, Mydei on by
    default; other wearers off, and every Basic ATK, Skill, and Ultimate when
    enabled). HP consumed by allies (e.g. Jingliu's Enhanced Skill) is not
    modelled.
  detail: >
    Convention (HP): allies' HP is simulated (e553888), so U12 models HP
    costs, heals, and thresholds with consumeHp/heal/setHp, hpRatio, and
    hpChanged, and an own-HP option is a [BUG]. Enemy hits stay on
    hitByEnemy (weight = aggro share), because hpChanged with hpCause
    enemy fires for every ally on every enemy attack. Remove the
    own-hp-consumed toggle and the per-wearer table. Gain a stack from
    hitByEnemy (stacks = weight) as now and from each hpChanged (subject
    self, hpCause consume), whoever consumed it ('by an ally or
    themselves': the wearer's own costs, Castorice's Skills, Jingliu's
    Spectral Transmigration attacks, Long May Rainbows Adorn the Sky).
    Needs those kits to call consumeHp.
- id: messenger-traversing-hackerspace-ally-ultimate
  entity: "114"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    "Uses their Ultimate on an ally" cannot be read from events: actionStart
    does not carry the ability's target type, and ally Ultimates cast with a
    plain `true` policy report the main enemy as target. The kit counts an
    Ultimate that deals no DMG or aims at an ally.
  detail: >
    Convention (ally target): an ability's ally target is read from
    event.abilityTarget (61c14f6): 'on an ally' (对我方目标) = ally, allies, or
    self; 'on one ally (target/character)' (我方单体) = ally, with
    event.target the ally; 'on all allies' = allies; 'on themselves' =
    self. Kits keep no inference from statuses, non-attacking Ultimates,
    or turn choices. Trigger on the wearer's Ultimate with abilityTarget
    ally, allies, or self; drop the no-DMG and ally-target proxy.

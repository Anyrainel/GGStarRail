- id: prisoner-in-deep-confinement-dot-count
  entity: "116"
  rule: U14
  status: open
  category: engine-gap
  summary: >
    Prisoner in Deep Confinement's 4-piece DEF ignore scales with the number
    of DoTs on the target (up to 3), but hit filters cannot count DoTs. Only
    the first DoT counts (6%), recognized by a Burn/Shock/Bleed/Wind Shear
    family, so DoT teams are undervalued by up to 12% DEF ignore.
  detail: >
    Blocked on engine-target-dot-count. Then ignore #1 DEF per DoT on the
    target, up to #2 DoTs. Meanwhile Character DoTs declare families
    (Kafka and Serval Shock, Sampo Wind Shear, Luka Bleed, Himeko, Hook,
    Guinaifen, and Jiaoqiu Burn, Hysilens's DoTs), so the first-DoT check
    sees them; Black Swan's Arcana still has none.
- id: pioneer-diver-debuff-chance
  entity: "117"
  rule: U9
  status: open
  category: engine-gap
  summary: >
    Pioneer Diver's doubled 4-piece effects trigger on every debuff the
    wearer applies, whatever its landing chance: statusApplied events do not
    carry the base chance, so a failed roll still doubles the effects.
  detail: >
    Blocked on engine-debuff-landing-chance. Then double the effects with
    the landing chance of the triggering debuff.
- id: bananamusement-summon-detection
  entity: "318"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    Kits cannot list a unit's summons or tell summoned targets (Numby,
    Lightning-Lord, Fuyuan, Souldragon) from countdowns (Concerto, Supreme
    Stance). The kit counts memosprites while present and a summon only after
    it has attacked and while it is still active, so the wearer's hits before
    the summon's first attack (Topaz, Jing Yuan) and summons that never attack
    (Souldragon outside its enhanced state) miss the 32% CRIT DMG.
  detail: >
    Track the wearer's memosprites and summons with summoned/departed
    (61c14f6, subject selfOrMemosprite), leaving out Action Order
    countdowns by definition ID as Sunday's SUMMON_IDS does (numby,
    lightning-lord, fuyuan, souldragon are summons; the '-countdown' IDs
    are not). The 32% applies from the moment one is summoned until none
    is left; drop the 'after its first attack' rule and the boundary
    polling.
- id: bananamusement-memosprite-crit-dmg
  entity: "318"
  rule: U3
  status: open
  category: verify
  summary: >
    The text names only the wearer's CRIT DMG. The kit also gives the
    conditional 32% to the wearer's memosprites (memosprite DMG reads the
    memosprite's own statuses), as the engine copies the wearer's equipment
    modifiers to memosprites. Confirm in game whether Garmentmaker and other
    memosprites receive it.
  detail: >
    Not settled; the same question as engine-memosprite-buff-inheritance.
    The text names only the wearer; fribbels applies the 32% to the
    wearer's action stats.
- id: giant-tree-healing-panel
  entity: "320"
  rule: E3
  status: open
  category: engine-gap
  summary: >
    The Outgoing Healing tiers are SPD-threshold scaling modifiers, which only
    damage evaluation resolves. Hyacine's healing tally reads
    panelStat("outgoingHealing") (steady panel only), so Giant Tree's 12%/20%
    never raises Little Ica's damage; the same 20% as a Relic stat raises
    Hyacine's damage by about 11% at 180 SPD.
  detail: >
    Blocked on engine-momentary-stat-read (a read that includes
    conditional scaling modifiers). Convention (Outgoing Healing): keep
    the tiers; they reach heal amounts and Hyacine's tally once those
    reads include them.
- id: tengoku-sp-scope
  entity: "324"
  rule: U10
  status: open
  category: verify
  summary: >
    "If 3 or more Skill Points are consumed in the same turn" counts Skill
    Points consumed by any ally during one turn of any unit (reset at every
    turn start). Confirm whether teammates' consumption counts or only the
    wearer's, and whether it must happen in the wearer's own turn.
  detail: >
    Not settled: the text names no consumer (若在同一回合内消耗...战技点) and fribbels
    uses an off-by-default toggle. Dazzled by a Flowery World counts only
    the wearer's consumption because its text is about the wearer.
- id: punklorde-elation-latch
  entity: "325"
  rule: E3
  status: open
  category: approximation
  summary: >
    The CRIT DMG tiers check the wearer's steady Elation with scaling
    `atLeast`, so they hold from battle start or never. Momentary Elation
    buffs that reach 40%/80% once in combat, which latch the bonus for the
    rest of the battle in game, are not counted.
  detail: >
    Blocked on engine-momentary-stat-read. Then latch each tier, as a
    battle-long status, the first time the wearer's Elation with statuses
    reaches #2 or #3.

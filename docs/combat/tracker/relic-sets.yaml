- id: sacerdos-relived-ordeal-ally-target
  entity: "121"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    Sacerdos' Relived Ordeal triggers only when a Skill or Ultimate event names
    an ally as its target, which happens only when a turn policy returns
    `{ ability, target }`. Ultimates aimed by kit heuristics (Sunday, Pearl,
    Trailblazer • Elation, Robin • Summeretto) report the main enemy, so they
    grant no CRIT DMG stacks.
  detail: >
    Triggers on Skills and Ultimates with abilityTarget === 'ally' and a
    non-enemy event.target, which gets the stack; abilities on all allies
    give none. Checked with Bronya and Sunday (named targets); Pearl and
    Robin • Summeretto name their Ultimate's ally in their policies too.
- id: wavestrider-captain-ally-target
  entity: "126"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    Wavestrider Captain gains Help only from another ally's ability whose
    event names the wearer as target (a turn choice with an ally target).
    Ultimates aimed by kit heuristics and abilities aimed at all allies
    (e.g. Robin's Ultimate) grant no Help.
  detail: >
    Gains 1 Help (stacks = weight) from another ally's action with
    abilityTarget 'ally' naming the wearer, or 'allies' (unconfirmed in
    game). Checked with the generic attacker next to Robin: Robin's Skill
    and Ultimate (on all allies) give the 2 Help that the wearer's Ultimate
    consumes for the ATK bonus.
- id: dreamlit-actor-ally-target
  entity: "133"
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    Dreamlit Actor triggers only when the wearer's Skill or Ultimate event
    names another ally as target (a turn choice with an ally target). Elation
    supports that pick their ally inside the ability (Pearl, Trailblazer •
    Elation, Robin • Summeretto Ultimates) never trigger it.
  detail: >
    Triggers on the wearer's Skills and Ultimates with abilityTarget 'ally'
    and event.target an ally other than the wearer. Checked with Sunday and
    a scratch support (named Skill target; a self target gives nothing; with
    10+ Certified Banger all allies get the CRIT DMG). Pearl and Robin •
    Summeretto name their Ultimate's ally in their policies too.
- id: poet-of-mourning-collapse-prebattle-spd
  entity: "124"
  rule: E3
  status: open
  category: engine-gap
  summary: >
    "Before entering battle" SPD is read from the wearer's steady panel
    (scaling source `applier`), which also holds unconditional in-battle kit

- id: warrior-goddess-heal-trigger
  entity: "125"
  rule: U12
  status: completed
  category: engine-gap
  summary: >
    Healing is not simulated, so Gentle Rain (wearer SPD, all allies' CRIT
    DMG) is an on-by-default "active" option held for the whole battle
    instead of a 2-turn state gained when the wearer or its memosprite heals
    another ally (once per turn).
  detail: >
    Removed the gentle-rain option and permanent stats. hpChanged with
    hpCause heal, source the wearer or its memosprite, and a healed ally
    that is neither (ZH 装备者及其忆灵以外的我方目标), limitPerTurn 1, gives Gentle Rain
    (#3 turns on the wearer, SPD +#1) and a unique CRIT DMG +#2 status on
    all allies, removed when Gentle Rain ends (statusRemoved); both take
    stacks = weight. Heals on full-HP allies fire since dd13fa1. Checked
    with a scratch healer (Skill heals on the wearer alone give nothing);
    healer kits count once they call ctx.heal.
- id: self-enshrouded-recluse-shield-state
  entity: "128"
  rule: U12
  status: completed
  category: engine-gap
  summary: >
    Shields are not simulated, so the CRIT DMG for allies holding the
    wearer's Shield is an on-by-default "active" option applied to all allies
    for the whole battle.
  detail: >
    Removed the shielded option and the team aura. A unique CRIT DMG +#2
    status follows each ally's Shields from the wearer: applied on
    statusApplied of a shield-family status by the wearer, removed on
    statusRemoved when no Shield from the wearer is left. Checked with a
    scratch shielder (one-ally and all-ally Shields). Only Luocha's E2
    Shield carries the family so far; other Shield kits count once they tag
    their Shields.
- id: divine-querying-master-smith-def-reduced
  entity: "132"
  rule: U14
  status: completed
  category: engine-gap
  summary: >
    There is no target filter for the generic "DEF reduction state". The kit
    collects StatusDefs with a `defReduction` modifier from statusApplied
    events and mirrors them with a marker status on each enemy, resynced
    before every action, which the CRIT DMG filter reads. Comburent triggers
    with certainty even when the DEF reduction was applied with a base chance.
  detail: >
    The CRIT DMG filter reads the engine's defReduced family; the marker
    status, the collected StatusDefs, and the resync before every action are
    gone. Comburent still triggers on a status with a DEF reduction applied
    by the wearer (same test as the family). Checked with Pela. The
    base-chance part is divine-querying-master-smith-debuff-chance.
- id: hero-of-triumphant-song-joint-atk
  entity: "123"
  rule: U8
  status: open
  category: verify
  summary: >
    Hero of Triumphant Song's CRIT DMG triggers when the memosprite starts an
    attack of its own. Memosprite parts of the owner's Joint ATKs (Aglaea's
    Enhanced Basic ATK) do not trigger it.
  detail: >
    Not settled: fribbels applies the CRIT DMG to the wearer and

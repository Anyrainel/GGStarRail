- id: sacerdos-relived-ordeal-ally-target
  entity: "121"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Sacerdos' Relived Ordeal triggers only when a Skill or Ultimate event names
    an ally as its target, which happens only when a turn policy returns
    `{ ability, target }`. Ultimates aimed by kit heuristics (Sunday, Pearl,
    Trailblazer • Elation, Robin • Summeretto) report the main enemy, so they
    grant no CRIT DMG stacks.
  detail: >
    Same gap as messenger-traversing-hackerspace-ally-ultimate: events need
    the ability's target type and the ally actually chosen. Two wearers'
    stacks share the cap through `unique` (the stronger copy applies), which
    undercounts when each wearer has given one stack.
- id: wavestrider-captain-ally-target
  entity: "126"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Wavestrider Captain gains Help only from another ally's ability whose
    event names the wearer as target (a turn choice with an ally target).
    Ultimates aimed by kit heuristics and abilities aimed at all allies
    (e.g. Robin's Ultimate) grant no Help.
  detail: >
    Needs the ability's target type and chosen ally on actionStart (see
    messenger-traversing-hackerspace-ally-ultimate). Also confirm in game
    whether all-ally abilities count as targeting the wearer.
- id: dreamlit-actor-ally-target
  entity: "133"
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Dreamlit Actor triggers only when the wearer's Skill or Ultimate event
    names another ally as target (a turn choice with an ally target). Elation
    supports that pick their ally inside the ability (Pearl, Trailblazer •
    Elation, Robin • Summeretto Ultimates) never trigger it.
  detail: "See messenger-traversing-hackerspace-ally-ultimate."
- id: poet-of-mourning-collapse-prebattle-spd
  entity: "124"
  rule: E3
  status: open
  category: engine-gap
  summary: >
    "Before entering battle" SPD is read from the wearer's steady panel
    (scaling source `applier`), which also holds unconditional in-battle kit
    modifiers. Castorice's A4 SPD +40% is such a modifier, so her panel SPD
    is 125.4 and Poet gives no CRIT Rate, although her pre-battle SPD is 87.4.
    Diviner of Distant Reach (130) reads SPD the same way.
  detail: >
    A pre-battle panel (base, Traces, Light Cone, Relics and set properties,
    without kit effects) readable by scaling would make both sets exact.
- id: warrior-goddess-heal-trigger
  entity: "125"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Healing is not simulated, so Gentle Rain (wearer SPD, all allies' CRIT
    DMG) is an on-by-default "active" option held for the whole battle
    instead of a 2-turn state gained when the wearer or its memosprite heals
    another ally (once per turn).
  detail: "Heal events (engine-hp-model) would let it follow the wearer's heals."
- id: self-enshrouded-recluse-shield-state
  entity: "128"
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Shields are not simulated, so the CRIT DMG for allies holding the
    wearer's Shield is an on-by-default "active" option applied to all allies
    for the whole battle.
  detail: "A shared Shielded state (engine-shield-state) would let it follow the wearer's Shields."
- id: divine-querying-master-smith-def-reduced
  entity: "132"
  rule: U14
  status: open
  category: engine-gap
  summary: >
    There is no target filter for the generic "DEF reduction state". The kit
    collects StatusDefs with a `defReduction` modifier from statusApplied
    events and mirrors them with a marker status on each enemy, resynced
    before every action, which the CRIT DMG filter reads. Comburent triggers
    with certainty even when the DEF reduction was applied with a base chance.
  detail: >
    A filter on incoming stats held by the target (or a "defReduced"
    family) would replace the marker.
- id: hero-of-triumphant-song-joint-atk
  entity: "123"
  rule: U8
  status: open
  category: verify
  summary: >
    Hero of Triumphant Song's CRIT DMG triggers when the memosprite starts an
    attack of its own. Memosprite parts of the owner's Joint ATKs (Aglaea's
    Enhanced Basic ATK) do not trigger it.
  detail: "Confirm in game whether a Joint ATK counts as the memosprite attacking."

    is 125.4 and Poet gives no CRIT Rate, although her pre-battle SPD is 87.4.
    Diviner of Distant Reach (130) reads SPD the same way.
  detail: >
    Blocked on engine-prebattle-panel. Then read the pre-battle SPD for

- id: sacerdos-relived-ordeal-ally-target
  entity: "121"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    Sacerdos' Relived Ordeal triggers only when a Skill or Ultimate event names
    an ally as its target, which happens only when a turn policy returns
    `{ ability, target }`. Ultimates aimed by kit heuristics (Sunday, Pearl,
    Trailblazer • Elation, Robin • Summeretto) report the main enemy, so they
    grant no CRIT DMG stacks.
  detail: >
    Convention (ally target): an ability's ally target is read from
    event.abilityTarget (61c14f6): 'on an ally' (对我方目标) = ally, allies, or
    self; 'on one ally (target/character)' (我方单体) = ally, with
    event.target the ally; 'on all allies' = allies; 'on themselves' =
    self. Kits keep no inference from statuses, non-attacking Ultimates,
    or turn choices. Trigger on Skills and Ultimates with abilityTarget
    === 'ally' and give the stack to event.target. Character kits whose
    single-ally abilities do not name the ally are filed as
    <name>-ally-target-event items. Two wearers keep the stronger copy
    (unique); whether their stacks pool in game is unverified.
- id: wavestrider-captain-ally-target
  entity: "126"
  rule: U8
  status: actionable
  category: engine-gap
  summary: >
    Wavestrider Captain gains Help only from another ally's ability whose
    event names the wearer as target (a turn choice with an ally target).
    Ultimates aimed by kit heuristics and abilities aimed at all allies
    (e.g. Robin's Ultimate) grant no Help.
  detail: >
    Convention (ally target): an ability's ally target is read from
    event.abilityTarget (61c14f6): 'on an ally' (对我方目标) = ally, allies, or
    self; 'on one ally (target/character)' (我方单体) = ally, with
    event.target the ally; 'on all allies' = allies; 'on themselves' =
    self. Kits keep no inference from statuses, non-attacking Ultimates,
    or turn choices. Gain 1 Help from another ally's action with
    abilityTarget === 'ally' and event.target the wearer, or with
    abilityTarget === 'allies' (an all-ally ability also targets the
    wearer; unconfirmed in game).

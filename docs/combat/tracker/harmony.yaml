- id: sunday-summon-ids
  entity: "1313"
  rule: C5
  status: completed
  category: engine-gap
  summary: >
    The Skill's summon bonus and "their summon takes action" find memosprites
    in ctx.allies but stat-less summons only through hard-coded kit-local IDs
    (lightning-lord, numby, fuyuan, souldragon); a new summon kit is missed
    until it is added to SUMMON_IDS in 1313-sunday.ts.
  detail: >
    SUMMON_IDS is gone. The kit tracks each owner's summons from
    `summoned` and `departed` events (kind summon, not `countdown`), in a
    WeakMap keyed by the battle's units, and the Skill reads memosprites
    from ctx.allies plus those tracked summons. Verified with Jing Yuan:
    totals are unchanged from the ID list.
- id: sunday-ultimate-target
  entity: "1313"
  rule: C3
  status: completed
  category: approximation
  summary: >
    The Ultimate picks its ally inside the ability (the Skill's heuristic)
    instead of through the Ultimate policy, and its Energy for that ally is
    scaled by ERR although the game gives a fixed amount.
  detail: >
    The Ultimate policy returns { ability: "ultimate", target } and the
    Ultimate reads ctx.target, so the target appears in its action events.
    Its Energy is fixed (`{ fixed: true }`), max(20% of Max Energy, A2's
    40). The ally comes from a `beneficiary` option (k.ally, origin skill)
    that both the Skill and Ultimate policies use; the default is the
    first teammate in team order not on a support Path.
- id: tribbie-a4-team-hp
  entity: "1403"
  rule: U7
  status: completed
  category: approximation
  summary: >
    A4's Max HP bonus (9% of the sum of all ally Characters' Max HP) is a
    stacking hpFlat status whose stacks are the summed steady-panel Max HP,
    set when the Zone opens; HP buffs from statuses and later changes are
    not counted.
  detail: >
    The Glass Ball stacks are the sum of the ally Characters'
    `currentStat("hp")` minus Tribbie's own A4 bonus (stacks x 9%), set
    when the Zone opens and resynced on every statusApplied/statusRemoved
    of a status with an hpPct or hpFlat modifier on an ally Character
    while it lasts. Converted HP is not modelled.

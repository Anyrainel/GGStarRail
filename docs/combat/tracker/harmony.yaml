- id: hanya-sanction-sub-targets
  entity: "1215"
  rule: U14
  status: open
  category: bug
  summary: >
    Sanction only checks the action's designated target for Burden; the game
    also grants it when Burden is on a Blast or AoE sub-target.
  detail: >
    Avatar_Hanya_00_Ability: WMAvatar_Hanya_BpZhanYin's OnListenBeforeSkillUse
    grants Sanction (MAvatar_Hanya_Passive_AddDamage) when the Burden holder is
    in the ability's SkillTargetEntityList or SkillSubTargetEntityList (Basic
    ATK/Skill/Ultimate), before the hits. Blocked on engine-action-targets:
    actionStart carries only the designated target, and the enemies an
    ability will hit are known only at actionEnd. Once actionStart lists
    them, grant Sanction when any of them has Burden.
- id: tingyun-ally-target-event
  entity: "1202"
  rule: C3
  status: actionable
  category: approximation
  summary: >
    Tingyun's Ultimate declares target "ally", but the Ultimate policy does not name the ally,
    so its action events report the main enemy as target and equipment that
    reads "an ability on one ally" (A Grounded Ascent, Sacerdos' Relived Ordeal, Wavestrider Captain) cannot see it.
  detail: >
    Return { ability: "ultimate", target } from the Ultimate policy with the ally the
    kit already picks, and use ctx.target inside the ability. Filed by Light Cone and Relic set triage: equipment reads "an ability on one ally" as event.abilityTarget === "ally" with event.target the ally (61c14f6).

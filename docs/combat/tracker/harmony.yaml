# Combat translation tracker: harmony. Schema: .agents/skills/hsr-combat/tracking.md
- id: asta-burn-base
  entity: "1009"
  rule: C2
  status: wont-do
  category: verify
  summary: >
    A2 Burn ("50% of DMG dealt by Asta's Basic ATK") is a DoT worth 50% of the
    Basic ATK multiplier on ATK; whether it instead copies the Basic ATK's
    actual damage needs confirmation.
  detail: >
    Kit is right. TurnBasedGameData Avatar_Asta_00_Ability (Skill01_Phase02)
    adds MCommon_DOT_Burn with Modifier_Burn_DamagePercentage = Basic ATK #1 x
    A2 #3 (opcode multiply), a normal ATK-scaled Burn DoT, not a copy of the
    hit's damage.
- id: yukong-a6-actions
  entity: "1207"
  rule: U8
  status: wont-do
  category: verify
  summary: >
    A6 grants Energy after every action of an ally Character or memosprite,
    Ultimates and follow-ups included (summons excluded); whether those count
    as "taking action" needs confirmation.
  detail: >
    Kit is right. Avatar_Yukong_00_Ability puts MAvatar_Yukong_00_Flower on
    AllTeamMemberWithUnselectable and on every Servant created later
    (ServantFlowerListen); A6 is that modifier's OnAfterSkillUse callback, so
    every ability use by a Character or memosprite holding it (Basic, Skill,
    Ultimate, follow-up, memosprite skills) regenerates the Energy.
- id: yukong-e2-energy-full
  entity: "1207"
  rule: U8
  status: open
  category: approximation
  summary: >
    E2 checks allies for full Energy after each ally action and each turn end
    instead of when Energy reaches the cap, so Energy filled and spent inside
    one action is missed.
  detail: >
    Blocked on engine-energy-received-event. The game listens to OnSPChange
    on each teammate (MAvatar_Yukong_00_Rank02_TeamMemberCheckSP); once an
    ally Energy-change event exists, grant the 5 Energy when an ally's Energy
    reaches its cap (once per ally until her Ultimate resets it) and drop the
    actionEnd/turnEnd polling.
- id: yukong-talent-instance
  entity: "1207"
  rule: C2
  status: wont-do
  category: verify
  summary: >
    The Talent's extra 80% ATK is added to the Basic ATK as one damage
    instance with doubled Toughness Reduction; if the game deals it as a
    separate instance, per-hit effects miss one hit.
  detail: >
    Kit is right. Avatar_Yukong_00_Skill01_Phase02 deals the enhanced Basic
    ATK as one attack whose DamagePercentage is Basic #1 + Talent #1 and whose
    StanceValue is x(1 + Talent #2). The game splits that attack into 20/20/60%
    sub-hits like most attacks; sub-hit splits are not modelled engine-wide.
- id: hanya-burden-counting
  entity: "1215"
  rule: U8
  status: open
  category: verify
  summary: >
    Hanya's own Skill that applies Burden is not counted toward Burden's
    "every 2 Basic ATKs, Skills, or Ultimates"; whether the game counts it
    is unconfirmed.
  detail: >
    Settled from Avatar_Hanya_00_Ability (WMAvatar_Hanya_BpZhanYin): any ally
    Basic ATK/Skill/Ultimate whose target or sub-target list contains the
    Burden enemy counts (Blast/AoE included); the Skill resets the recovery
    count (ZhanYinCount = #2, ZhanYinCount_01 = 0) and a new Burden starts at
    0 attacks. Sanction and debuff findings: hanya-sanction-sub-targets,
    hanya-burden-not-debuff.
    Still open: Burden is added inside the Skill (after its hit) and counts on
    OnListenAfterSkillUse, so the applying Skill may count as the first
    attack; the config alone does not show whether a modifier created
    mid-skill receives that skill's AfterSkillUse event. Needs an in-game
    check (Burden mark half-filled right after Hanya's Skill or not).
- id: ruan-mei-rebloom-break-extension
  entity: "1303"
  rule: U11
  status: open
  category: engine-gap
  summary: >
    Thanatoplum Rebloom should cancel the enemy's Weakness Break recovery
    (it stays Broken) and delay that turn. The engine recovers the enemy at
    the same turn start and lets it act, so the kit deals the Break DMG and
    delays the enemy's next turn instead; Broken-only effects (Super Break,
    E2, the Broken Toughness multiplier) miss the extended window.
  detail: >
    Blocked on engine-break-recovery-hook. Once it exists, Rebloom handles
    the recovery attempt: keep the enemy Broken, deal 50% Ice Break DMG,
    replace the enemy's turn with a delay of (20% x Break Effect + 10%), and
    remove Rebloom (re-application waits for the real recovery). The game
    marks the modifier with the BreakExtend behaviour flag.
- id: ruan-mei-rebloom-debuff
  entity: "1303"
  rule: U3
  status: actionable
  category: bug
  summary: >
    Thanatoplum Rebloom is modeled as an enemy status that is not a debuff,
    but the game classifies it as a debuff, so debuff counts (Acheron,
    Jiaoqiu, minTargetDebuffs filters) miss it.
  detail: >
    AvatarStatusConfig 10013033 (MAvatar_RuanMei_PassiveArea_Enemy,
    "Thanatoplum Rebloom") has StatusType Debuff. Declare the rebloom status
    with `debuff: true` (no base chance: it always lands).
- id: ruan-mei-a6-steady-break-effect
  entity: "1303"
  rule: U7
  status: open
  category: approximation
  summary: >
    A6's Overtone bonus and Rebloom's action delay read Ruan Mei's steady
    Break Effect, so E4's timed +100% Break Effect raises neither; in game
    both use her current Break Effect.
  detail: >
    Blocked on engine-applier-momentary-stats (the Overtone A6 modifier is
    applier-scaled); the Rebloom delay reads panelStat and also needs
    engine-momentary-stat-read. Confirmed dynamic in game:
    Avatar_RuanMei_Tree03_BreakDamageAddedValueShow recomputes the A6 bonus on
    every BreakDamageAddedRatio change and refreshes Overtone on allies. Once
    those exist, both should read Ruan Mei's current Break Effect (E4
    included).
- id: bronya-e4-followup-crit
  entity: "1101"
  rule: U4
  status: wont-do
  category: verify
  summary: >
    E4's Follow-Up ATK ("80% of her Basic ATK DMG") is modeled as Follow-Up
    DMG with 80% of the Basic ATK multiplier, so A2's 100% Basic ATK CRIT
    Rate does not apply. Confirm whether it inherits Basic ATK's CRIT Rate.
  detail: >
    Kit is right. Avatar_Bronya_00_Ability: A2 is M_Bronya_Critcal, added only

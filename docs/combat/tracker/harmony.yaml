- id: tingyun-benediction-cap-snapshot
  entity: "1202"
  rule: U7
  status: wont-do
  category: approximation
  summary: >
    Benediction's "ATK +50%, up to 25% of Tingyun's current ATK" is decided
    once per Skill from steady panels (holder's base ATK x 50% vs Tingyun's
    ATK x 25%), applying either the percent or the capped flat form; in game
    the cap follows Tingyun's current ATK.
  detail: >
    The game also decides once per Skill. Avatar_TingYun_Skill02_Phase02
    computes min(target BaseAttack x #2, Tingyun Attack x #4) when the Skill
    is used and grants it as flat ATK (MWAvatar_TingYun_00_BPSkill_AttackDelta);
    it does not follow Tingyun's ATK afterwards. The only gap is Tingyun's
    momentary ATK buffs at cast time, which the engine's steady-panel applier
    reads exclude everywhere.

- id: harmony-auras-late-memosprites
  entity: "1403"
  rule: U3
  status: actionable
  category: approximation
  summary: >
    Timed team buffs (Tribbie's Numinosity and E1, Trailblazer Harmony's
    Backup Dancer, Sunday's The Beatified) are applied to the allies present
    at cast time; a memosprite summoned or re-summoned later (Garmentmaker)
    does not get the remaining duration.
  detail: >
    The game applies these as halo sub-modifiers of the caster's status (for
    Tribbie, IsHaloStatus on MAvatar_Tribbie_00_SKL02_Buff), so units created
    later receive them for the remaining time. With the new events: in each
    kit, listen to `summoned` (subject "ally") and, while the buff is active
    (Tribbie: Numinosity and E1 on any ally; Trailblazer Harmony
    8005: Backup Dancer; Sunday 1313: The Beatified on the memosprite's
    owner), apply the status to the new memosprite with
    `turns: holder.remainingTurns(status)` read from an ally that holds it.
- id: cerydra-coup-de-main-order
  entity: "1412"
  rule: U11
  status: open
  category: approximation
  summary: >
    Coup de Main ("copy and immediately use the ability about to be used, then
    use the original") is queued after the Peerage holder's Skill: the first
    use keeps Peerage and the queued use runs with Military Merit after 6
    Charge is consumed. The queued use's Skill Points are refunded through
    skillPointsChanged (other kits see a spend and a refund), and it
    regenerates the holder's Skill Energy again, which is unverified.
  detail: >
    Blocked on engine-queued-action-options. Once queueAction can run an
    ability before the current one and free of Skill Points, insert the copy
    first (no SP spend, no refund), keep Peerage for both uses, and revert to
    Military Merit (consuming 6 Charge) after the original. Coup de Main text
    from ExtraEffectConfig 10000023 (not in the dossier).
- id: trailblazer-harmony-a2-zone
  entity: "8005"
  rule: U2
  status: wont-do
  category: verify
  summary: >
    A2 ("the Super Break DMG triggered by Backup Dancer increases by 20-60%")
    is modeled as extra superBreakDmg on the Backup Dancer conversion rate
    (100% + 60% against one enemy, as community calculators do), not as DMG
    Boost scoped to Super Break per the U2 table. Confirm the zone.
  detail: >
    Kit is right. Avatar_PlayerBoy_20 MAvatar_PlayerBoy_20_SkillP01_ListenBreakDamage
    sets the Super Break percentage to conversion x (1 + A2 value for the
    alive enemy count), a conversion multiplier, not DMG Boost. The Ultimate's
    conversion (#2) is 1 at every level, so 1 + A2 equals the kit's additive
    superBreakDmg.
- id: hanya-burden-not-debuff
  entity: "1215"
  rule: U3
  status: actionable
  category: bug
  summary: >
    Burden is declared a debuff, but the game classifies it as neither buff
    nor debuff, so it inflates debuff counts (Acheron, Jiaoqiu,
    minTargetDebuffs filters).
  detail: >
    AvatarStatusConfig 10012152 (WMAvatar_Hanya_BpZhanYin, "Burden") has

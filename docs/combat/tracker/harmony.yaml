- id: ruan-mei-rebloom-break-extension
  entity: "1303"
  rule: U11
  status: open
  category: engine-gap
  summary: >
    Thanatoplum Rebloom should cancel the enemy's Weakness Break recovery
    (it stays Broken) and delay that turn. The engine recovers the enemy at
    the same turn start and lets it act, so the kit deals the Break DMG and
    delays the enemy's next turn instead; Broken-only effects (Super Break,
    E2, the Broken Toughness multiplier) miss the extended window.
  detail: "Needs a hook at Weakness Break recovery that can keep the enemy Broken and replace its turn with a delay."

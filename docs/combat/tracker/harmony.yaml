- id: sparkle-e6-spread-duration
  entity: "1306"
  rule: U5
  status: wont-do
  category: approximation
  summary: >
    E6's Ultimate spreads the Skill's CRIT DMG Boost to Cipher teammates
    with a fresh duration instead of the remaining duration of the ally it

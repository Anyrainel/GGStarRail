- id: tingyun-benediction-cap-snapshot
  entity: "1202"
  rule: U7
  status: wont-do
  category: approximation
  summary: >
    Benediction's "ATK +50%, up to 25% of Tingyun's current ATK" is decided
    once per Skill from steady panels (holder's base ATK x 50% vs Tingyun's
    ATK x 25%), applying either the percent or the capped flat form; in game
    the cap follows Tingyun's current ATK.
  detail: >
    The game also decides once per Skill. Avatar_TingYun_Skill02_Phase02
    computes min(target BaseAttack x #2, Tingyun Attack x #4) when the Skill
    is used and grants it as flat ATK (MWAvatar_TingYun_00_BPSkill_AttackDelta);
    it does not follow Tingyun's ATK afterwards. The only gap is Tingyun's
    momentary ATK buffs at cast time, which the engine's steady-panel applier
    reads exclude everywhere.
- id: tingyun-ult-energy-err
  entity: "1202"
  rule: U10
  status: actionable
  category: bug
  summary: >
    The Ultimate's 50 Energy (60 at E6) for the ally is scaled by the
    receiver's Energy Regeneration Rate; the game gives a fixed amount.
  detail: >
    Avatar_TingYun_Skill03_Phase02 grants it with ModifySPNew FixedAddValue
    (#1 + E6 #1), the same field The Herta's "fixed Energy" A2 uses; ERR-scaled
    gains (her A6) use AddValue. Call `ctx.gainEnergy(target, ultimateEnergy,
    { fixed: true })`. Neither the receiver's nor Tingyun's ERR applies.
- id: sunday-summon-ids
  entity: "1313"
  rule: C5
  status: open
  category: engine-gap
  summary: >
    The Skill's summon bonus and "their summon takes action" find memosprites
    in ctx.allies but stat-less summons only through hard-coded kit-local IDs
    (lightning-lord, numby, fuyuan, souldragon); a new summon kit is missed

    the `summoned`/`departed` events) and delete SUMMON_IDS.
- id: sunday-ultimate-target
  entity: "1313"
  rule: C3
  status: actionable
  category: approximation
  summary: >
    The Ultimate picks its ally inside the ability (the Skill's heuristic)
    instead of through the Ultimate policy, and its Energy for that ally is
    scaled by ERR although the game gives a fixed amount.
  detail: >
    Ultimate policies can now return `{ ability: "ultimate", target }`: move
    designate() into the Ultimate policy and read `ctx.target` in the
    Ultimate, so the target shows in the action and `abilityTarget` events.
    Energy: Avatar_Sunday_10 Skill03 grants it with ModifySPNew FixedAddValue
    (fixed, like Tingyun's), so call `ctx.gainEnergy(target, amount,
    { fixed: true })` with amount = max(20% x target Max Energy, A2 minimum).
    A user-chosen teammate still waits on engine-ally-option-vocabulary.
- id: tribbie-a4-team-hp
  entity: "1403"
  rule: U7
  status: open
  category: approximation
  summary: >
    A4's Max HP bonus (9% of the sum of all ally Characters' Max HP) is a
    stacking hpFlat status whose stacks are the summed steady-panel Max HP,
    set when the Zone opens; HP buffs from statuses and later changes are
    not counted.
  detail: >
    Blocked on engine-momentary-stat-read. In game
    (MAvatar_Tribbie_00_SKL03_PointB2) the bonus is 9% of the sum of ally
    Avatars' (Max HP - converted HP), recomputed whenever an ally's HP stats
    change (ListenHPChange). Once current stats can be read, sync the stacks
    from allies' current Max HP (excluding Tribbie's own A4 bonus) at Zone
    open and on every change.
- id: tribbie-zone-highest-hp
  entity: "1403"
  rule: U12
  status: open
  category: approximation
  summary: >
    Enemy HP is not simulated, so the Zone's Additional DMG goes to the main
    target (the boss) when the attack hit it, else to the first enemy hit,
    instead of the hit target with the highest current HP.
  detail: >
    Blocked on engine-kill-triggers (enemy HP). The boss-first choice matches
    the usual case; once enemy HP exists, pick the hit enemy with the highest
    current HP.

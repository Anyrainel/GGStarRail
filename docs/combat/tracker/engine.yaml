# Combat engine tracker. Schema: .agents/skills/hsr-combat/tracking.md
- id: engine-elation-punchline-amounts
  entity: engine
  rule: U8
  status: open
  category: needs-data
  summary: >
    Punchline gained at battle start and after each Aha action scales with the
    number of Elation Characters; the amounts are not in the reference data, so
    `punchlinePerElationCharacter` defaults to 0.
  detail: "Glossary text confirms the mechanic; values need datamined config or in-game measurement."
- id: engine-elation-participant-order
  entity: engine
  rule: C1
  status: open
  category: needs-data
  summary: >
    Aha Instant orders Elation Skills by hidden Participant ID; the engine uses
    team slot order.
  detail: ""
- id: engine-elation-laughter
  entity: engine
  rule: C1
  status: open
  category: needs-data
  summary: >
    Aha's own "Let There Be Laughter" (used when no unit has an Elation Skill)
    is not modeled; its Punchline-scaled multiplier is unknown.
  detail: ""
- id: engine-break-unbroken-multiplier
  entity: engine
  rule: U2
  status: open
  category: verify
  summary: >
    The breaking hit's Break DMG uses the 0.9 unbroken Toughness multiplier
    (community claim); Elation DMG also uses 0.9/1.0. Both need confirmation.
  detail: ""
- id: engine-memosprite-buff-inheritance
  entity: engine
  rule: C5
  status: open
  category: verify
  summary: >
    Memosprites share the owner's panel and permanent elemental bonuses but
    not the owner's combat statuses (fribbels model); confirm in game.
  detail: ""
- id: engine-super-break-zones
  entity: engine
  rule: U2
  status: open
  category: verify
  summary: >
    "Super Break DMG increases by X%" is modeled as DMG Boost scoped to Super
    Break, separate from the conversion multiplier `superBreakDmg`; confirm the
    two are different zones.
  detail: ""
- id: engine-energy-fixed-sources
  entity: engine
  rule: U10
  status: open
  category: verify
  summary: >
    All Energy except abilities' own regeneration is ERR-scaled unless a kit
    marks it fixed; the glossary says some sources ignore ERR without listing
    them.
  detail: ""
- id: engine-enemy-attack-energy
  entity: engine
  rule: U8
  status: open
  category: approximation
  summary: >
    Each enemy turn is one single-target attack worth 10 Energy (scenario
    setting), distributed by aggro; real enemy skills vary (5-25, AoE).
  detail: ""
- id: engine-kill-triggers
  entity: engine
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Enemy HP and kills are not simulated; "upon defeating an enemy" effects
    are user options.
  detail: ""
- id: engine-pass-wave1
  entity: engine
  rule: U8
  status: completed
  category: engine-gap
  summary: >
    Engine pass after wave 1. Kit items that worked around any of these gaps
    should adopt the construct now available (see kit-authoring.md).
  detail: >
    Fixed: ActionContext Skill Points/cycle frozen at action start; status
    landing-chance cache ignoring re-applied chances; once-per-turn limits
    counting firings instead of weight (now weighted, plus a `when`
    predicate checked before limits and limitPerOwnTurn); breakdown rows merging different abilities
    (groups key on abilityId; deal inside an ability is credited to it, and
    DealOptions.abilityId names proc rows); targetWeakness filters read after
    the battle (now snapshotted per hit); team SPD auras ignored by turn order;
    summons ignoring SPD statuses; enemy Slow having no effect; stat-scaled
    incoming modifiers ignored; Break Frozen relied on a hard-coded check
    (now skipsTurn); timeline energyAfter recorded before actionEnd; actions
    queued at turn end running a turn late; extra turns from Ultimates waiting
    a turn; optimizer timeline caches ignoring stats read in battle.
    Added: HitFilter targetStatuses/targetFamilies/minTargetDebuffs/
    targetBroken/targetRoles; StatusDef.family and skipsTurn; setStatusStacks;
    endsTurn false; hits as a function, attack, afterHit, ctx.scratch,
    ctx.targetsHit, actionEnd targetsHit; split shape and AoE main/each;
    toughnessWithoutWeakness, reduceToughness options, timed implantWeakness
    and removeWeakness; silent hits; Ultimate variants and resources,
    castOutsideActionOrder; turn choices with an ally target and usable on
    turn abilities; skillPointsChanged and setMaxSkillPoints; gainEnergy
    overflow; findSummon; summons' attacks count as the owner's for self
    listeners; UnitView pathId/slot/actionGauge/hasFamily; ctx time and
    mainTarget; policy upcoming/extraTurn/usedThisTurn; dotTick detonation;
    the "assist" damage tag; dossier reads AvatarSkillConfigLD and prints
    #n[fN] values correctly.
- id: engine-hp-model
  entity: engine
  rule: U12
  status: open
  category: engine-gap
  summary: >
    HP is not simulated. Blade, Arlan, Jingliu, Mydei, Clara and others use
    toggles or counters for HP thresholds, HP lost, and healing triggers.
  detail: >
    A minimal per-unit HP fraction (consume, heal, set) with a threshold
    crossing event and heal events would replace most of these workarounds.
- id: engine-aggro-modifiers
  entity: engine
  rule: U12
  status: open
  category: engine-gap
  summary: >
    Aggro cannot be modified (Taunt, aggro increases), and Departed units are
    still targeted by enemy attacks.
  detail: ""
- id: engine-enemy-tier
  entity: engine
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Enemies have no tier (elite/boss vs normal); kits with elite-only effects
    treat the middle enemy as the only elite.
  detail: ""
- id: engine-super-break-unbroken
  entity: engine
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Super Break only applies to Weakness Broken enemies; The Dahlia's Zone
    lets it apply to unbroken ones, and deal() cannot produce Super Break.
  detail: ""
- id: engine-separate-timeline
  entity: engine
  rule: U11
  status: open
  category: engine-gap
  summary: >
    No territory or paused-clock state: Phainon's transformation runs as a
    chain of queued actions, and teammates still react to it.
  detail: ""
- id: engine-ally-turn-takeover
  entity: engine
  rule: C3
  status: open
  category: engine-gap
  summary: >
    A kit cannot act through another ally's turn (Himeko Nova's ally-used
    Assist Skills) or replace an ally's action choice.
  detail: ""
- id: engine-energy-received-event
  entity: engine
  rule: U10
  status: open
  category: engine-gap
  summary: >
    No event for Energy received from a teammate (Phainon) or for Energy
    overflow from other sources than the kit's own gainEnergy calls.
  detail: ""
- id: engine-ally-option-vocabulary
  entity: engine
  rule: U8
  status: open
  category: engine-gap
  summary: >
    Single-ally designations (March 7th's Shifu, Fugue's Prayer target, The
    Dahlia's Dance Partner, Jade's Debt Collector) are heuristics; there is no
    option type for choosing a teammate.
  detail: ""
- id: engine-control-turn-start-dmg
  entity: engine
  rule: U9
  status: open
  category: engine-gap
  summary: >
    Kit Freezes deal Additional DMG at the Frozen enemy's turn start, but a
    status can only carry periodic damage as a `dot` (tagged DoT, detonated,
    emits dotTick). March 7th and Gepard deal it from turnStart weighted by
    the base chance, so Effect Hit Rate and Effect RES do not scale it.
  detail: >
    Needs non-DoT periodic damage on a status (Additional DMG tags) resolved
    with the status's evaluated landing chance. E1 March 7th's Energy per
    Frozen target uses the same base-chance weight, consistent with the
    engine's turn skip.
- id: engine-shield-state
  entity: engine
  rule: U12
  status: open
  category: engine-gap
  summary: >
    There is no shared "Shielded" state: March 7th's Counter and Aventurine's
    E6 see only their own shield markers, so Shields from other kits (Gepard's
    Ultimate, Fortified Wager for March 7th) do not count and Shields broken
    by enemy hits never drop.
  detail: >
    A generic shield family (or flag) that kits apply alongside their own
    statuses would let "Shielded ally" checks see every source.
- id: engine-scaled-spd-turn-order
  entity: engine
  rule: U7
  status: open
  category: engine-gap
  summary: >
    Turn order ignores SPD modifiers with `scaling`. Hanya's Ultimate ("SPD
    +20% of Hanya's SPD") works around it with a spdFlat status worth 1 per
    stack, its stacks set from Hanya's panelStat("spd").
  detail: "When turn order reads applier-scaled SPD, ten-lords-decree-spd in 1215-hanya.ts should use scaling { source: applier, stat: spd }."
- id: engine-status-lifecycle
  entity: engine
  rule: U5
  status: open
  category: engine-gap
  summary: >
    No event fires when a status expires or is removed, and a kit cannot read
    or extend a status's remaining turns ("extends Invigoration by 1 turn",
    "when Invigoration ends"); Bailu tracks Invigoration with counters.
  detail: ""
- id: engine-play-override-turn-choice
  entity: engine
  rule: C3
  status: open
  category: engine-gap
  summary: >
    playPolicy in team/assemble.ts only compares the kit's choice with the
    strings "skill"/"basic", so a `{ ability, target }` choice (Huohuo, Bailu)
    bypasses the "avoid" Skill override.
  detail: ""
- id: engine-elation-zero-banger
  entity: engine
  rule: U8
  status: open
  category: verify
  summary: >
    Once Aha has joined the Action Order it acts even at 0 Punchline, and its
    participants gain Certified Banger worth 0. certifiedBanger() sums
    values, so kits read such a banger as not held ("while holding Certified
    Banger").
  detail: >
    Seen in a Sparxie/Yao Guang/Pearl/Robin run, where an Aha Instant came
    before anyone regained Punchline. Need to confirm whether Aha acts at 0
    Punchline, and whether holding Certified Banger should be a state
    separate from its value.
- id: engine-elation-kind-tag
  entity: engine
  rule: U4
  status: open
  category: engine-gap
  summary: >
    A hit with `kind: "elation"` does not get the `elation` tag. Only Elation
    Skill abilities add it by default, so procs dealt with `deal` must add it
    themselves, or "when dealing Elation DMG" filters (Yao Guang E1's DEF
    ignore) miss them.
  detail: "Adding the tag automatically for kind elation would remove the convention."
